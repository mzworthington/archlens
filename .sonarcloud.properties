# Automatic Analysis cannot ingest coverage. CI scan uses sonar-project.properties.
# Disable Automatic Analysis in SonarCloud after the first CI scan.
# Automatic Analysis cannot ignore a single rule (githubactions:S7637).
# Waykit pins Actions by version tag, not commit SHA — keep workflows out of
# analysis so the house pin does not fail the quality gate.
sonar.exclusions=.github/workflows/**
