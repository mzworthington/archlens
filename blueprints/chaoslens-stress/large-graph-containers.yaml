# yaml-language-server: $schema=https://blueprint.mzworthington.co.uk/schemas/latest/blueprint.schema.json
version: https://blueprint.mzworthington.co.uk/schemas/v3/blueprint.schema.json
level: container
metaData:
  entityRef: blueprint/chaoslens-stress/large-graph
  name: ChaosLens — Large Graph (Monte Carlo)
  description: >
    ~45 nodes across edge, BFF, domain, and data tiers with cross-cutting
    shared services. Preset resilience YAML on BFFs (bulkhead), shared-auth
    (circuitBreaker+bulkhead), catalog (localCache), and recommendations
    (retry+localCache). Retail BFF also has circuitBreaker — fault domain-orders
    to see containment at the BFF. Stress-tests WASM Monte Carlo throughput,
    canvas heat-map rendering, safeguard badges, and telemetry at scale.
nodes:
  - entityRef: blueprint/chaoslens-stress/large-graph/edge-web-01
    type: web-app
    name: Web Edge 01
  - entityRef: blueprint/chaoslens-stress/large-graph/edge-web-02
    type: web-app
    name: Web Edge 02
  - entityRef: blueprint/chaoslens-stress/large-graph/edge-mobile-01
    type: mobile-app
    name: Mobile Edge 01
  - entityRef: blueprint/chaoslens-stress/large-graph/edge-mobile-02
    type: mobile-app
    name: Mobile Edge 02
  - entityRef: blueprint/chaoslens-stress/large-graph/edge-partner-01
    type: rest-api
    name: Partner Edge 01
  - entityRef: blueprint/chaoslens-stress/large-graph/edge-partner-02
    type: rest-api
    name: Partner Edge 02
  - entityRef: blueprint/chaoslens-stress/large-graph/bff-retail
    type: rest-api
    name: Retail BFF
    resilience:
      bulkhead: true
      circuitBreaker: true
  - entityRef: blueprint/chaoslens-stress/large-graph/bff-ops
    type: rest-api
    name: Ops BFF
    resilience:
      bulkhead: true
  - entityRef: blueprint/chaoslens-stress/large-graph/bff-analytics
    type: rest-api
    name: Analytics BFF
    resilience:
      bulkhead: true
  - entityRef: blueprint/chaoslens-stress/large-graph/shared-auth
    type: microservice
    name: Shared Auth
    resilience:
      bulkhead: true
      circuitBreaker: true
  - entityRef: blueprint/chaoslens-stress/large-graph/shared-config
    type: microservice
    name: Config Service
    resilience:
      circuitBreaker: true
  - entityRef: blueprint/chaoslens-stress/large-graph/shared-notify
    type: microservice
    name: Notification Hub
  - entityRef: blueprint/chaoslens-stress/large-graph/domain-orders
    type: microservice
    name: Orders Domain
  - entityRef: blueprint/chaoslens-stress/large-graph/domain-catalog
    type: microservice
    name: Catalog Domain
    resilience:
      localCache: true
  - entityRef: blueprint/chaoslens-stress/large-graph/domain-inventory
    type: microservice
    name: Inventory Domain
  - entityRef: blueprint/chaoslens-stress/large-graph/domain-pricing
    type: microservice
    name: Pricing Domain
  - entityRef: blueprint/chaoslens-stress/large-graph/domain-shipping
    type: microservice
    name: Shipping Domain
  - entityRef: blueprint/chaoslens-stress/large-graph/domain-returns
    type: microservice
    name: Returns Domain
  - entityRef: blueprint/chaoslens-stress/large-graph/domain-recommendations
    type: microservice
    name: Recommendations
    resilience:
      retry: true
      localCache: true
  - entityRef: blueprint/chaoslens-stress/large-graph/domain-search
    type: microservice
    name: Search Service
  - entityRef: blueprint/chaoslens-stress/large-graph/domain-reviews
    type: microservice
    name: Reviews Service
  - entityRef: blueprint/chaoslens-stress/large-graph/domain-loyalty
    type: microservice
    name: Loyalty Service
  - entityRef: blueprint/chaoslens-stress/large-graph/data-orders-db
    type: database
    name: Orders DB
  - entityRef: blueprint/chaoslens-stress/large-graph/data-catalog-db
    type: database
    name: Catalog DB
  - entityRef: blueprint/chaoslens-stress/large-graph/data-inventory-db
    type: database
    name: Inventory DB
  - entityRef: blueprint/chaoslens-stress/large-graph/data-search-index
    type: database
    name: Search Index
  - entityRef: blueprint/chaoslens-stress/large-graph/data-events
    type: event-broker
    name: Event Bus
  - entityRef: blueprint/chaoslens-stress/large-graph/worker-fulfillment
    type: background-worker
    name: Fulfillment Worker
  - entityRef: blueprint/chaoslens-stress/large-graph/worker-billing
    type: background-worker
    name: Billing Worker
  - entityRef: blueprint/chaoslens-stress/large-graph/worker-reindex
    type: background-worker
    name: Reindex Worker
dependencies:
  - from: blueprint/chaoslens-stress/large-graph/edge-web-01
    to: blueprint/chaoslens-stress/large-graph/bff-retail
    type: direct-call
