    type: direct-call
  - from: blueprint/chaoslens-stress/large-graph/bff-retail
    to: blueprint/chaoslens-stress/large-graph/domain-orders
    type: direct-call
  - from: blueprint/chaoslens-stress/large-graph/bff-retail
    to: blueprint/chaoslens-stress/large-graph/domain-catalog
    type: direct-call
  - from: blueprint/chaoslens-stress/large-graph/bff-retail
