apiVersion: blueprint.dev/v4
kind: Diagram
metadata:
  name: ChaosLens — Diamond DAG
  entityRef: blueprint/chaoslens-stress/diamond
spec:
  level: container
  nodes:
    - entityRef: blueprint/chaoslens-stress/diamond/entry
      type: web-app
      name: Entry Point
    - entityRef: blueprint/chaoslens-stress/diamond/service-a
      type: microservice
      name: Service A
    - entityRef: blueprint/chaoslens-stress/diamond/service-b
      type: microservice
      name: Service B
    - entityRef: blueprint/chaoslens-stress/diamond/aggregator
      type: microservice
      name: Aggregator
    - entityRef: blueprint/chaoslens-stress/diamond/cache
      type: database
      name: Shared Cache
  dependencies:
    - from: blueprint/chaoslens-stress/diamond/entry
      to: blueprint/chaoslens-stress/diamond/service-a
      type: direct-call
    - from: blueprint/chaoslens-stress/diamond/entry
      to: blueprint/chaoslens-stress/diamond/service-b
      type: direct-call
    - from: blueprint/chaoslens-stress/diamond/service-a
      to: blueprint/chaoslens-stress/diamond/aggregator
      type: direct-call
    - from: blueprint/chaoslens-stress/diamond/service-b
      to: blueprint/chaoslens-stress/diamond/aggregator
      type: direct-call
    - from: blueprint/chaoslens-stress/diamond/aggregator
      to: blueprint/chaoslens-stress/diamond/cache
      type: read-write
