version: https://archlens.dev/schemas/v3/blueprint.schema.json
level: container
metaData:
  entityRef: blueprint/chaoslens-stress/pub-sub-integrity
  name: Pub-Sub Integrity Stress
nodes:
  - entityRef: blueprint/chaoslens-stress/pub-sub-integrity/web
    name: Web App
    type: web-app
  - entityRef: blueprint/chaoslens-stress/pub-sub-integrity/orders
    name: Orders API
    type: microservice
  - entityRef: blueprint/chaoslens-stress/pub-sub-integrity/events
    name: Event Bus
    type: event-broker
  - entityRef: blueprint/chaoslens-stress/pub-sub-integrity/fulfillment
    name: Fulfillment Worker
    type: background-worker
  - entityRef: blueprint/chaoslens-stress/pub-sub-integrity/billing
    name: Billing Worker
    type: background-worker
dependencies:
  - from: blueprint/chaoslens-stress/pub-sub-integrity/web
    to: blueprint/chaoslens-stress/pub-sub-integrity/orders
    type: direct-call
  - from: blueprint/chaoslens-stress/pub-sub-integrity/orders
    to: blueprint/chaoslens-stress/pub-sub-integrity/events
    type: publish-subscribe
  - from: blueprint/chaoslens-stress/pub-sub-integrity/fulfillment
    to: blueprint/chaoslens-stress/pub-sub-integrity/events
    type: publish-subscribe
  - from: blueprint/chaoslens-stress/pub-sub-integrity/billing
    to: blueprint/chaoslens-stress/pub-sub-integrity/events
    type: publish-subscribe
  - from: blueprint/chaoslens-stress/pub-sub-integrity/billing
    to: blueprint/chaoslens-stress/pub-sub-integrity/orders
    type: direct-call
