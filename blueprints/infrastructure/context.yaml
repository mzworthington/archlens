  - entityRef: blueprint/aws-domain-redirect
    type: software-system
    name: Aws-domain-redirect System
    parentEntityRef: blueprint/terraform-examples
    properties:
      rootPath: aws/aws_domain_redirect
      productId: terraform-examples
dependencies:
  - from: blueprint/user
    to: blueprint/helloworld
    type: direct-call
    description: Uses
  - from: blueprint/user
    to: blueprint/terraform-examples
    type: direct-call
    description: Uses
