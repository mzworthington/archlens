      rootPath: gcp-py-cloudrun-cloudsql
      productId: helloworld
  - entityRef: blueprint/terraform-examples
    type: group
    name: Terraform Examples System
    properties:
      rootPath: ''
      productId: terraform-examples
  - entityRef: blueprint/aws-lambda-api
    type: software-system
    name: Aws-lambda-api System
    parentEntityRef: blueprint/terraform-examples
    properties:
      rootPath: aws/aws_lambda_api
