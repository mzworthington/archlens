version: https://archlens.dev/schemas/v4/blueprint.schema.json
level: component
metadata:
  entityRef: backstage/plugins/catalog-backend/ingestion
  name: Ingestion Components
  source:
    remoteUrl: https://github.com/backstage/backstage
    defaultBranch: master
    scannedAtCommit: a052aea0e24911fcac803085ed79f3fe23e0a46e
    scanRoot: .
nodes:
  - entityRef: backstage/plugins/catalog-backend/ingestion/location-analyzer
    type: background-worker
    name: LocationAnalyzer
    isTest: false
    properties:
      filepath: plugins/catalog-backend/src/ingestion/LocationAnalyzer.ts
      containerId: catalog-backend
      technology: TypeScript Domain Service
      classification: default
  - entityRef: backstage/plugins/catalog-backend/ingestion/catalog-rules
    type: background-worker
    name: CatalogRules
    isTest: false
    properties:
      filepath: plugins/catalog-backend/src/ingestion/CatalogRules.ts
      containerId: catalog-backend
      technology: TypeScript Domain Service
      classification: default
  - entityRef: backstage/plugins/catalog-backend/ingestion/catalog-rules-test
    type: background-worker
    name: CatalogRules
    isTest: true
    properties:
      filepath: plugins/catalog-backend/src/ingestion/CatalogRules.test.ts
      containerId: catalog-backend
      technology: TypeScript Domain Service
      classification: default
  - entityRef: backstage/plugins/catalog-common/index
    type: background-worker
    name: Index (External)
    external: true
    properties:
      filepath: plugins/catalog-common/src/index.ts
      containerId: catalog-common
      technology: TypeScript Domain Service
      classification: default
    position:
      x: -130
      y: 404
  - entityRef: backstage/plugins/catalog-node/index
    type: rest-api
    name: Index (External)
    external: true
    properties:
      filepath: plugins/catalog-node/src/api/index.ts
      containerId: catalog-node
      technology: REST Controller / Router
      classification: api-marker
    position:
      x: 330
      y: 404
dependencies:
  - from: backstage/plugins/catalog-backend/ingestion/location-analyzer
    to: backstage/plugins/catalog-common/index
    type: direct-call
    description: '@backstage/plugin-catalog-common'
  - from: backstage/plugins/catalog-backend/ingestion/location-analyzer
    to: backstage/plugins/catalog-node/index
    type: direct-call
    description: '@backstage/plugin-catalog-node'
  - from: backstage/plugins/catalog-backend/ingestion/catalog-rules
    to: backstage/plugins/catalog-common/index
    type: direct-call
    description: '@backstage/plugin-catalog-common'
  - from: backstage/plugins/catalog-backend/ingestion/catalog-rules-test
    to: backstage/plugins/catalog-backend/ingestion/catalog-rules
    type: direct-call
    description: Calls module / service
  - from: backstage/plugins/catalog-backend/ingestion/catalog-rules-test
    to: backstage/plugins/catalog-common/index
    type: direct-call
    description: '@backstage/plugin-catalog-common'
