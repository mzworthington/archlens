# Blueprint toolchain: Node/pnpm/Bun (app/) + Go (resilience-engine / ChaosLens WASM).
[tools]
node = "26.4.0"
pnpm = "11.10.0"
bun = "1.3.14"
go = "1.26.5"
# Docs media: designer GIFs (record:docs-media) + CLI tape (test:vhs).
ffmpeg = "8.1.2"
vhs = "0.11.0"
# ttyd (VHS): aqua has no darwin/arm64 build — Linux CI uses apt; on macOS: brew install ttyd

[tasks.install]
description = "Install app/ Node dependencies"
run = "cd app && pnpm install"

[tasks.dev]
description = "Designer dev server (docs + canvas)"
run = "cd app && pnpm dev"

[tasks.build-wasm]
description = "Build ChaosLens Go WASM into designer public assets"
run = "make -C resilience-engine copy-wasm"

[tasks.test-go]
description = "Resilience engine (Go) unit tests"
run = "make -C resilience-engine test"

[tasks.check-go]
description = "Go fmt, vet, and WASM freshness (matches CI quality job)"
run = "make -C resilience-engine check"

[tasks.test]
description = "Run all app/ unit tests"
run = "cd app && pnpm test"

[tasks.build]
description = "Production build (WASM + designer + CLI)"
depends = ["build-wasm"]
run = "cd app && pnpm build"

[tasks.sync-derived]
description = "Regenerate derived outputs (changelog, schema, features, docs media) and commit"
run = "bin/sync-derived.sh"
