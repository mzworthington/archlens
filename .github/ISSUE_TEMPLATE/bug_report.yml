name: Bug report
description: Report a problem with the template or generated project
labels: [bug]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - App / UI
        - Docs
        - CI / GitHub Actions
        - Cloudflare / Pulumi
        - Toolchain / setup
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Clear description of the bug
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
