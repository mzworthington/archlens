version: 2
updates:
  # App monorepo (pnpm workspace under app/)
  - package-ecosystem: "npm"
    directory: "/app"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "00:00"
    open-pull-requests-limit: 5
    # Direct deps only. Transitive security fixes otherwise land as
    # lockfile-only PRs (pnpm-lock.yaml with no package.json change).
    allow:
      - dependency-type: "direct"
    # Always raise the manifest constraint so the lockfile never moves alone.
    versioning-strategy: "increase"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
    # web-tree-sitter 0.26+ cannot load tree-sitter-wasms 0.1.13 (0.20 ABI / dylink).
    # https://github.com/tree-sitter/tree-sitter/issues/5171
    ignore:
      - dependency-name: "web-tree-sitter"
        versions: [">=0.21.0"]
    groups:
      npm-security:
        applies-to: "security-updates"
        patterns:
          - "*"
      npm-minor-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Cloudflare Pulumi project (separate pnpm workspace)
  - package-ecosystem: "npm"
    directory: "/infra/cloudflare"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "00:00"
    open-pull-requests-limit: 5
    allow:
      - dependency-type: "direct"
    versioning-strategy: "increase"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
    groups:
      npm-security:
        applies-to: "security-updates"
        patterns:
          - "*"
      npm-minor-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "gomod"
    directory: "/resilience-engine"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "00:00"
    open-pull-requests-limit: 5
    allow:
      - dependency-type: "direct"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      go-security:
        applies-to: "security-updates"
        patterns:
          - "*"
      go-minor-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "00:00"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      actions:
        patterns:
          - "*"
