name: Setup ArchLens CLI
description: Install the ArchLens CLI from GitHub releases (binary + tree-sitter WASMs).

inputs:
  archlens-version:
    description: ArchLens CLI version to install (release tag)
    required: false
    default: latest

runs:
  using: composite
  steps:
    - name: Install ArchLens CLI
      shell: bash
      run: |
        set -euo pipefail
        install_args=(--dir "$HOME/.local/bin")
        version="${{ inputs.archlens-version }}"
        if [[ -n "$version" && "$version" != "latest" ]]; then
          install_args+=(--version "$version")
        fi
        curl -fsSL https://raw.githubusercontent.com/mzworthington/archlens/main/scripts/install.sh | sh -s -- "${install_args[@]}"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        if [[ ! -f "$HOME/.local/bin/tree-sitter.wasm" ]]; then
          echo "Installed archlens is missing tree-sitter.wasm beside the binary." >&2
          echo "Re-publish a CLI release that includes runtime WASM, or pin an older workflow that builds from source." >&2
          ls -la "$HOME/.local/bin" || true
          exit 1
        fi
        archlens --version
