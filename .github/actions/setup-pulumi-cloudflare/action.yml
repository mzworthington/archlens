name: Setup Pulumi Cloudflare
description: Install Node/pnpm deps and configure the Pulumi prod stack from GitHub secrets/vars
runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@v6
      with:
        version: 11.10.0
        run_install: false

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: pnpm
        cache-dependency-path: infra/cloudflare/pnpm-lock.yaml

    - name: Install dependencies
      shell: bash
      working-directory: infra/cloudflare
      run: pnpm install --frozen-lockfile

    - name: Setup Pulumi CLI
      uses: pulumi/setup-pulumi@v2

    - name: Configure Pulumi stack
      shell: bash
      working-directory: infra/cloudflare
      env:
        PULUMI_ACCESS_TOKEN: ${{ env.PULUMI_ACCESS_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
        CLOUDFLARE_ZONE_ID: ${{ env.CLOUDFLARE_ZONE_ID }}
        CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_API_TOKEN }}
        PULUMI_PAGES_PROJECT_NAME: ${{ env.PULUMI_PAGES_PROJECT_NAME }}
        PULUMI_APEX_DOMAIN: ${{ env.PULUMI_APEX_DOMAIN }}
        PULUMI_WWW_DOMAIN: ${{ env.PULUMI_WWW_DOMAIN }}
        PULUMI_CATALOG_BUCKET_NAME: ${{ env.PULUMI_CATALOG_BUCKET_NAME }}
        PULUMI_CATALOG_DOMAIN: ${{ env.PULUMI_CATALOG_DOMAIN }}
      run: |
        pulumi stack select prod 2>/dev/null || pulumi stack init prod
        pulumi config set accountId "$CLOUDFLARE_ACCOUNT_ID"
        pulumi config set zoneId "$CLOUDFLARE_ZONE_ID"
        pulumi config set pagesProjectName "${PULUMI_PAGES_PROJECT_NAME:-archlens}"
        pulumi config set apexDomain "${PULUMI_APEX_DOMAIN:-archlens.dev}"
        pulumi config set wwwDomain "${PULUMI_WWW_DOMAIN:-www.archlens.dev}"
        pulumi config set catalogBucketName "${PULUMI_CATALOG_BUCKET_NAME:-archlens-blueprint-catalog}"
        pulumi config set catalogDomain "${PULUMI_CATALOG_DOMAIN:-blueprints.archlens.dev}"
        pulumi config set --secret cloudflare:apiToken "$CLOUDFLARE_API_TOKEN"
