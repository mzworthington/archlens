name: Publish blueprint catalog

# Scan this repo → fragment into the shared samples estate → compose (ADR-0014).
# Canvas loads estates/samples/ so ArchLens appears alongside hand-authored samples and demos.
# Cron safety net: compose-catalog.yml.

on:
  schedule:
    - cron: '0 5 * * *' # 05:00 UTC daily
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-blueprint-catalog
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: production
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup ArchLens CLI
        uses: ./.github/actions/setup-archlens-cli

      - name: Assemble declared ArchLens context seed
        run: |
          set -euo pipefail
          node scripts/assemble-context-seed.mjs \
            --declaration=scripts/declared-contexts/archlens.json \
            --output=blueprints/archlens/context.yaml

      - name: Scan, publish fragment, and compose
        env:
          OBJECT_STORAGE_PROVIDER: r2
          OBJECT_STORAGE_BUCKET: ${{ secrets.R2_BLUEPRINT_CATALOG_BUCKET }}
          OBJECT_STORAGE_KEY_PREFIX: estates/samples
          R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_BLUEPRINT_CATALOG_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_BLUEPRINT_CATALOG_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          archlens scan --headless \
            --output=blueprints \
            --context=archlens

          archlens catalog publish-fragment blueprints/ \
            --estate=samples \
            --product=archlens \
            --source-ref="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}@${GITHUB_SHA}" \
            --key-prefix=estates/samples \
            --no-dry-run \
            --format=json

          archlens catalog compose \
            --estate=samples \
            --workspace-name=samples \
            --key-prefix=estates/samples \
            --no-dry-run \
            --format=json
