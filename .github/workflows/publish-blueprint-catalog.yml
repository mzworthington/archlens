name: Publish blueprint catalog

# Customer-facing example: install the latest CLI release, scan this repo, publish.
# Publish prefers visibility (validation does not block by default). Use `archlens validate`
# or `scan/publish --validate` only when you want a hard CI gate.
# ADR-0014 Phase 0: publish under estates/archlens/ so samples/demos do not share this latest.
# Copy into your pipeline as:
#   archlens scan --headless --output=blueprints --context=my-app --publish

on:
  schedule:
    - cron: '0 5 * * *' # 05:00 UTC daily
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-blueprint-catalog
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install ArchLens CLI
        run: |
          set -euo pipefail
          ./scripts/install.sh --dir "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          archlens --version

      - name: Scan and publish
        env:
          OBJECT_STORAGE_PROVIDER: r2
          OBJECT_STORAGE_BUCKET: ${{ secrets.R2_BLUEPRINT_CATALOG_BUCKET }}
          OBJECT_STORAGE_KEY_PREFIX: estates/archlens
          R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_BLUEPRINT_CATALOG_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_BLUEPRINT_CATALOG_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          archlens scan --headless \
            --output=blueprints \
            --context=archlens \
            --workspace-name=archlens \
            --key-prefix=estates/archlens \
            --publish \
            --skip-validation
