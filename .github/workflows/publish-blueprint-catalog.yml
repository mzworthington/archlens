name: Publish blueprint catalog

# Dogfood: scan this repo → stage a fragment → compose the estate catalog (ADR-0014).
# Primary stitch trigger is this workflow; compose-catalog.yml is the cron safety net.
# Publish prefers visibility (validation does not block by default).
# Customer multi-pipeline pattern:
#   archlens scan --headless --output=blueprints --context=my-app
#   archlens catalog publish-fragment blueprints/ --estate=my-estate --product=my-app --source-ref=repo@sha --no-dry-run
#   archlens catalog compose --estate=my-estate --no-dry-run

on:
  schedule:
    - cron: '0 5 * * *' # 05:00 UTC daily
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-blueprint-catalog
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: production
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup ArchLens CLI
        uses: ./.github/actions/setup-archlens-cli

      - name: Scan, publish fragment, and compose
        env:
          OBJECT_STORAGE_PROVIDER: r2
          OBJECT_STORAGE_BUCKET: ${{ secrets.R2_BLUEPRINT_CATALOG_BUCKET }}
          OBJECT_STORAGE_KEY_PREFIX: estates/archlens
          R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_BLUEPRINT_CATALOG_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_BLUEPRINT_CATALOG_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          archlens scan --headless \
            --output=blueprints \
            --context=archlens

          archlens catalog publish-fragment blueprints/ \
            --estate=archlens \
            --product=archlens \
            --source-ref="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}@${GITHUB_SHA}" \
            --key-prefix=estates/archlens \
            --no-dry-run \
            --format=json

          archlens catalog compose \
            --estate=archlens \
            --workspace-name=archlens \
            --key-prefix=estates/archlens \
            --no-dry-run \
            --format=json
