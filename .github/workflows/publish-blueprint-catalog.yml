name: Publish blueprint catalog

# Customer-facing example: install the latest CLI release, scan this repo, publish.
# Copy into your pipeline as:
#   archlens scan --headless --output=blueprints --context=my-app --publish

on:
  schedule:
    - cron: '0 5 * * *' # 05:00 UTC daily
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-blueprint-catalog
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install ArchLens CLI
        run: |
          set -euo pipefail
          ./scripts/install.sh --dir "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          archlens --version

      - name: Scan and publish
        env:
          OBJECT_STORAGE_PROVIDER: r2
          OBJECT_STORAGE_BUCKET: ${{ secrets.R2_BLUEPRINT_CATALOG_BUCKET }}
          R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_BLUEPRINT_CATALOG_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_BLUEPRINT_CATALOG_SECRET_ACCESS_KEY }}
        run: archlens scan --headless --output=blueprints --context=archlens --publish
