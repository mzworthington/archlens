name: Rebase conflicting Dependabot PRs

# Dependabot's own rebase (rebase-strategy: auto, the default) runs when it
# notices a conflict, which can wait until the weekly version-update schedule.
# This job asks immediately after main moves, so lockfile siblings do not sit
# conflicted until Sunday.

on:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  rebase:
    runs-on: ubuntu-latest
    # A push whose actor is Dependabot gets a read-only token and cannot comment.
    if: github.actor != 'dependabot[bot]'
    steps:
      - name: Ask Dependabot to rebase conflicting pull requests
        uses: actions/github-script@v7
        with:
          script: |
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
            const { owner, repo } = context.repo;
            const prs = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: "open",
              per_page: 100,
            });

            for (const pr of prs) {
              if (pr.user?.login !== "dependabot[bot]") continue;

              let details = null;
              for (let attempt = 0; attempt < 6; attempt++) {
                if (attempt > 0) await sleep(5000);
                const { data } = await github.rest.pulls.get({
                  owner,
                  repo,
                  pull_number: pr.number,
                });
                details = data;
                if (data.mergeable !== null) break;
              }

              const conflicting =
                details.mergeable === false || details.mergeable_state === "dirty";
              if (!conflicting) {
                core.info(
                  `#${pr.number} mergeable=${details.mergeable} state=${details.mergeable_state}; skipped`,
                );
                continue;
              }

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pr.number,
                body: "@dependabot rebase",
              });
              core.info(`Asked Dependabot to rebase #${pr.number}`);
            }
