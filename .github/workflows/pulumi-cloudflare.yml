name: Pulumi Cloudflare

# Flow: preview (always) → GitHub Environment approval on apply → pulumi up.
# Create Environment "pulumi-prod" with required reviewers for the manual gate:
#   Settings → Environments → pulumi-prod → Required reviewers

on:
  pull_request:
    paths:
      - 'infra/cloudflare/**'
      - '.github/workflows/pulumi-cloudflare.yml'
      - '.github/actions/setup-pulumi-cloudflare/**'
  push:
    branches: [main]
    paths:
      - 'infra/cloudflare/**'
      - '.github/workflows/pulumi-cloudflare.yml'
      - '.github/actions/setup-pulumi-cloudflare/**'
  workflow_dispatch:
    inputs:
      apply:
        description: After preview, wait for pulumi-prod approval then run pulumi up
        type: boolean
        default: true

permissions:
  contents: read
  pull-requests: write
  deployments: write

concurrency:
  group: pulumi-cloudflare-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preview:
    name: Preview
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Pulumi Cloudflare
        uses: ./.github/actions/setup-pulumi-cloudflare
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PULUMI_PAGES_PROJECT_NAME: ${{ vars.PULUMI_PAGES_PROJECT_NAME }}
          PULUMI_APEX_DOMAIN: ${{ vars.PULUMI_APEX_DOMAIN }}
          PULUMI_WWW_DOMAIN: ${{ vars.PULUMI_WWW_DOMAIN }}
          PULUMI_CATALOG_BUCKET_NAME: ${{ vars.PULUMI_CATALOG_BUCKET_NAME }}
          PULUMI_CATALOG_DOMAIN: ${{ vars.PULUMI_CATALOG_DOMAIN }}

      - name: Pulumi preview
        uses: pulumi/actions@v6
        with:
          command: preview
          stack-name: prod
          work-dir: infra/cloudflare
          comment-on-pr: ${{ github.event_name == 'pull_request' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

  apply:
    name: Apply (pulumi up)
    needs: preview
    if: >-
      (github.ref == 'refs/heads/main' && github.event_name == 'push')
      || (github.event_name == 'workflow_dispatch' && inputs.apply)
    runs-on: ubuntu-latest
    environment:
      name: pulumi-prod
      url: https://archlens.dev
    # Serialize applies against the shared Pulumi Cloud stack (avoids 409 conflicts).
    concurrency:
      group: pulumi-cloudflare-prod-apply
      cancel-in-progress: false
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Pulumi Cloudflare
        uses: ./.github/actions/setup-pulumi-cloudflare
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PULUMI_PAGES_PROJECT_NAME: ${{ vars.PULUMI_PAGES_PROJECT_NAME }}
          PULUMI_APEX_DOMAIN: ${{ vars.PULUMI_APEX_DOMAIN }}
          PULUMI_WWW_DOMAIN: ${{ vars.PULUMI_WWW_DOMAIN }}
          PULUMI_CATALOG_BUCKET_NAME: ${{ vars.PULUMI_CATALOG_BUCKET_NAME }}
          PULUMI_CATALOG_DOMAIN: ${{ vars.PULUMI_CATALOG_DOMAIN }}

      - name: Pulumi up
        uses: pulumi/actions@v6
        with:
          command: up
          stack-name: prod
          work-dir: infra/cloudflare
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
