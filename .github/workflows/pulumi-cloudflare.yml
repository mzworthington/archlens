name: Pulumi Cloudflare

on:
  pull_request:
    paths:
      - 'infra/cloudflare/**'
      - '.github/workflows/pulumi-cloudflare.yml'
  push:
    branches: [main]
    paths:
      - 'infra/cloudflare/**'
      - '.github/workflows/pulumi-cloudflare.yml'
  workflow_dispatch:
    inputs:
      command:
        description: Pulumi command (manual run from Actions tab)
        type: choice
        default: up
        options:
          - up
          - preview

permissions:
  contents: read
  pull-requests: write

jobs:
  pulumi:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/cloudflare
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.10.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: infra/cloudflare/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Pulumi CLI
        uses: pulumi/setup-pulumi@v2

      - name: Configure Pulumi stack
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          pulumi stack select prod 2>/dev/null || pulumi stack init prod
          pulumi config set accountId "$CLOUDFLARE_ACCOUNT_ID"
          pulumi config set zoneId "$CLOUDFLARE_ZONE_ID"
          pulumi config set --secret cloudflare:apiToken "$CLOUDFLARE_API_TOKEN"

      - name: Pulumi preview
        if: >-
          github.event_name == 'pull_request'
          || (github.event_name == 'workflow_dispatch' && inputs.command == 'preview')
        uses: pulumi/actions@v6
        with:
          command: preview
          stack-name: prod
          work-dir: infra/cloudflare
          comment-on-pr: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

      - name: Pulumi up
        if: >-
          (github.ref == 'refs/heads/main' && github.event_name == 'push')
          || (github.event_name == 'workflow_dispatch' && inputs.command == 'up')
        uses: pulumi/actions@v6
        with:
          command: up
          stack-name: prod
          work-dir: infra/cloudflare
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
