name: Publish samples catalog

# Hand-authored samples/ → fragment → compose estates/samples (ADR-0014).
# Cron safety net: compose-catalog.yml.

on:
  push:
    branches: [main]
    paths:
      - 'samples/**'
      - '.github/workflows/publish-samples.yml'
      - '.github/actions/setup-archlens-cli/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-samples
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup ArchLens CLI
        uses: ./.github/actions/setup-archlens-cli

      - name: Publish fragment and compose
        env:
          OBJECT_STORAGE_PROVIDER: r2
          OBJECT_STORAGE_BUCKET: ${{ secrets.R2_BLUEPRINT_CATALOG_BUCKET }}
          OBJECT_STORAGE_KEY_PREFIX: estates/samples
          R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_BLUEPRINT_CATALOG_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_BLUEPRINT_CATALOG_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          archlens catalog publish-fragment samples/ \
            --estate=samples \
            --product=samples \
            --source-ref="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}@${GITHUB_SHA}" \
            --key-prefix=estates/samples \
            --no-dry-run \
            --format=json

          archlens catalog compose \
            --estate=samples \
            --workspace-name=samples \
            --key-prefix=estates/samples \
            --no-dry-run \
            --format=json
