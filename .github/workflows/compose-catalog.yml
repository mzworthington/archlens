name: Compose catalog

# Safety-net stitch: re-compose the shared samples estate from staged fragments + overlays.
# Primary compose: publish-blueprint-catalog / publish-samples (after fragment);
# publish-demo-catalog runs one final compose after the matrix (ADR-0014).
# After a CLI release that includes no-op compose, this job usually skips re-upload when
# latest already matches the content hash.

on:
  schedule:
    - cron: '15 * * * *' # hourly at :15 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: samples-estate-compose
  cancel-in-progress: false

jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup ArchLens CLI
        uses: ./.github/actions/setup-archlens-cli

      - name: Compose samples estate
        env:
          OBJECT_STORAGE_PROVIDER: r2
          OBJECT_STORAGE_BUCKET: ${{ secrets.R2_BLUEPRINT_CATALOG_BUCKET }}
          OBJECT_STORAGE_KEY_PREFIX: estates/samples
          R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_BLUEPRINT_CATALOG_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_BLUEPRINT_CATALOG_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          # Defense in depth: CLI has R2 + compose retries; workflow retries whole compose
          # for residual R2 blips (and for release lag before the no-op compose ships).
          max_attempts=3
          for attempt in $(seq 1 "$max_attempts"); do
            if archlens catalog compose \
              --estate=samples \
              --workspace-name=samples \
              --key-prefix=estates/samples \
              --allow-empty \
              --no-dry-run \
              --format=json; then
              exit 0
            fi
            if [[ "$attempt" -eq "$max_attempts" ]]; then
              echo "Compose failed after ${max_attempts} workflow attempt(s)." >&2
              exit 1
            fi
            sleep_seconds=$((attempt * 20))
            echo "Compose attempt ${attempt} failed; retrying in ${sleep_seconds}s…" >&2
            sleep "$sleep_seconds"
          done
