name: CI & Deployment Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      deploy_to_cloudflare:
        description: Deploy designer build to Cloudflare Pages after CI (main only)
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.10.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
        working-directory: app

      - name: Check Code Formatting
        run: pnpm format:check
        working-directory: app

      - name: Check Linting Rules
        run: pnpm lint
        working-directory: app

      - name: Typecheck
        run: pnpm typecheck
        working-directory: app

      - name: Check JSON Schema is up to date
        run: pnpm generate:schema -- --check
        working-directory: app

      - name: Check Unused Code & Dependencies (Knip)
        run: pnpm knip --reporter github-actions
        working-directory: app

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: resilience-engine/go.mod
          cache-dependency-path: resilience-engine/go.mod

      - name: Check Go formatting and vet
        run: make check
        working-directory: resilience-engine

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.10.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
        working-directory: app

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: resilience-engine/go.mod
          cache-dependency-path: resilience-engine/go.mod

      - name: Test resilience engine (Go)
        run: make test
        working-directory: resilience-engine

      - name: Run unit tests with coverage and features doc
        run: pnpm test:ci
        working-directory: app

      - name: Report Vitest Coverage
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: app
          json-summary-path: coverage/coverage-summary.json
          json-final-path: coverage/coverage-final.json

  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.10.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
        working-directory: app

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: resilience-engine/go.mod
          cache-dependency-path: resilience-engine/go.mod

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('app/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @archlens/designer exec playwright install --with-deps chromium
        working-directory: app

      - name: Run E2E and accessibility tests
        run: pnpm test:e2e
        working-directory: app

      - name: Upload Playwright Report & Screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            app/packages/designer/playwright-report/
            app/packages/designer/test-results/
            docs/screenshots/
          retention-days: 30

  build:
    runs-on: ubuntu-latest
    needs: [quality, unit-tests]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.10.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: resilience-engine/go.mod
          cache-dependency-path: resilience-engine/go.mod

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
        working-directory: app

      - name: Regenerate derived docs for production build
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: pnpm generate:schema && pnpm generate:features-unit
        working-directory: app

      - name: Compile Production Build
        env:
          VITE_REMOTE_CATALOG_BASE_URL: ${{ github.ref == 'refs/heads/main' && 'https://blueprints.archlens.dev/estates/samples/' || '' }}
        run: pnpm build
        working-directory: app

      - name: Upload designer dist
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v7
        with:
          name: designer-dist
          path: app/packages/designer/dist
          retention-days: 1

  deploy-cloudflare:
    needs: [build, e2e]
    if: >-
      github.ref == 'refs/heads/main'
      && (
        github.event_name == 'push'
        || (github.event_name == 'workflow_dispatch' && inputs.deploy_to_cloudflare)
      )
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://archlens.dev
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Download designer dist
        uses: actions/download-artifact@v8
        with:
          name: designer-dist
          path: app/packages/designer/dist

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy app/packages/designer/dist --project-name=archlens --branch=main

  check-release:
    needs: [build, e2e]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    outputs:
      skip: ${{ steps.detect.outputs.skip }}
      release_cli: ${{ steps.detect.outputs.release_cli }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect CLI release
        id: detect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bin/release-cli.sh detect

  build-ts-cli-binaries:
    needs: check-release
    if: needs.check-release.outputs.release_cli == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.10.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
        working-directory: app

      - name: Resolve CLI release version
        id: cli_version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "tag=$(bin/release-cli.sh next-version)" >> "$GITHUB_OUTPUT"

      - name: Compile TS CLI Binaries
        env:
          ARCHLENS_VERSION: ${{ steps.cli_version.outputs.tag }}
        run: |
          bun app/packages/cli/scripts/emitBuildVersion.ts
          mkdir -p dist/linux dist/macos-x64 dist/macos-arm64 dist/windows
          bun build app/packages/cli/src/cli/archlens.ts --compile --target=bun-linux-x64 --outfile=dist/linux/archlens
          bun build app/packages/cli/src/cli/archlens.ts --compile --target=bun-darwin-x64 --outfile=dist/macos-x64/archlens
          bun build app/packages/cli/src/cli/archlens.ts --compile --target=bun-darwin-arm64 --outfile=dist/macos-arm64/archlens
          bun build app/packages/cli/src/cli/archlens.ts --compile --target=bun-windows-x64 --outfile=dist/windows/archlens.exe
          bun app/packages/cli/scripts/copyTreeSitterWasms.ts \
            dist/linux dist/macos-x64 dist/macos-arm64 dist/windows

      - name: Package Archives
        run: |
          mkdir -p dist/archives
          tar -czf dist/archives/archlens-linux-x64.tar.gz -C dist/linux .
          tar -czf dist/archives/archlens-macos-x64.tar.gz -C dist/macos-x64 .
          tar -czf dist/archives/archlens-macos-arm64.tar.gz -C dist/macos-arm64 .
          (cd dist/windows && zip -r ../archives/archlens-windows-x64.zip .)
          (cd dist/archives && sha256sum archlens-*.tar.gz archlens-*.zip > checksums.txt)
          cp dist/archives/checksums.txt dist/checksums.txt

      - name: Upload TS Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ts-cli-binaries
          path: dist/archives/

  publish-cli-release:
    needs: [check-release, build-ts-cli-binaries]
    if: needs.check-release.outputs.release_cli == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download TS Artifacts
        uses: actions/download-artifact@v8
        with:
          name: ts-cli-binaries
          path: dist

      - name: Publish CLI release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bin/release-cli.sh publish
