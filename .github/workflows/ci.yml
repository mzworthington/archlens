name: CI & Deployment Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_to_cloudflare:
        description: Deploy Canvas (Pages) and collab Worker after CI (main only)
        type: boolean
        default: true

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.10.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
        working-directory: app

      - name: Check Code Formatting
        run: pnpm format:check
        working-directory: app

      - name: Check Linting Rules
        run: pnpm lint
        working-directory: app

      - name: Typecheck
        run: pnpm typecheck
        working-directory: app

      - name: Check JSON Schema is up to date
        run: pnpm generate:schema -- --check
        working-directory: app

      - name: Check Unused Code & Dependencies (Knip)
        run: pnpm knip --reporter github-actions
        working-directory: app

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: resilience-engine/go.mod
          cache-dependency-path: resilience-engine/go.mod

      - name: Check Go formatting and vet
        run: make check
        working-directory: resilience-engine

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.10.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
        working-directory: app

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: resilience-engine/go.mod
          cache-dependency-path: resilience-engine/go.mod

      - name: Test resilience engine (Go)
        run: make test
        working-directory: resilience-engine

      - name: Run unit tests with coverage and features doc
        run: pnpm test:ci
        working-directory: app

      - name: Report Vitest Coverage
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: app
          json-summary-path: coverage/coverage-summary.json
          json-final-path: coverage/coverage-final.json

  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.10.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
        working-directory: app

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: resilience-engine/go.mod
          cache-dependency-path: resilience-engine/go.mod

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('app/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @archlens/canvas exec playwright install --with-deps chromium
        working-directory: app

      - name: Run E2E and accessibility tests
        run: pnpm test:e2e
        working-directory: app

      - name: Upload Playwright Report & Screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            app/packages/canvas/playwright-report/
            app/packages/canvas/test-results/
            docs/screenshots/
          retention-days: 30

  build:
    runs-on: ubuntu-latest
    needs: [quality, unit-tests]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.10.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: resilience-engine/go.mod
          cache-dependency-path: resilience-engine/go.mod

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
        working-directory: app

      - name: Regenerate derived docs for production build
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: pnpm generate:schema && pnpm generate:features-unit
        working-directory: app

      - name: Compile Production Build
        env:
          VITE_REMOTE_CATALOG_BASE_URL: ${{ github.ref == 'refs/heads/main' && 'https://blueprints.archlens.dev/estates/samples/' || '' }}
          VITE_COLLAB_WS_URL: ${{ github.ref == 'refs/heads/main' && 'wss://collab.archlens.dev' || '' }}
          POSTHOG_TOKEN: ${{ secrets.POSTHOG_TOKEN }}
          POSTHOG_HOST: ${{ github.ref == 'refs/heads/main' && 'https://a.mzworthington.co.uk' || '' }}
        run: pnpm build
        working-directory: app

      - name: Upload canvas dist
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v7
        with:
          name: canvas-dist
          path: app/packages/canvas/dist
          retention-days: 1

  deploy-cloudflare:
    needs: [build, e2e]
    if: >-
      github.ref == 'refs/heads/main'
      && (
        github.event_name == 'push'
        || (github.event_name == 'workflow_dispatch' && inputs.deploy_to_cloudflare)
      )
    runs-on: ubuntu-latest
    concurrency:
      group: production-pages
      cancel-in-progress: false
    environment:
      name: production
      url: https://archlens.dev
    outputs:
      previous_deployment_id: ${{ steps.capture.outputs.previous_deployment_id }}
      previous_sha: ${{ steps.capture.outputs.previous_sha }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.10.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
        working-directory: app

      - name: Capture previous Pages identity
        id: capture
        working-directory: app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec tsx scripts/deploySmoke/run.ts capture-pages

      - name: Download canvas dist
        uses: actions/download-artifact@v8
        with:
          name: canvas-dist
          path: app/packages/canvas/dist

      - name: Deploy to Cloudflare Pages
        id: deploy_pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy app/packages/canvas/dist --project-name=archlens --branch=main

      - name: Publish Canvas deploy summary
        if: always()
        env:
          PAGES_URL: ${{ steps.deploy_pages.outputs.deployment-url }}
          PREVIOUS_ID: ${{ steps.capture.outputs.previous_deployment_id }}
        run: |
          {
            echo "## Canvas Pages"
            echo "- **env:** production"
            echo "- **sha:** \`${GITHUB_SHA}\`"
            echo "- **build id:** \`${GITHUB_SHA:0:12}\`"
            echo "- **url:** https://archlens.dev"
            if [ -n "${PAGES_URL}" ]; then
              echo "- **deployment url:** ${PAGES_URL}"
            fi
            if [ -n "${PREVIOUS_ID}" ]; then
              echo "- **previous deployment:** \`${PREVIOUS_ID}\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-collab:
    needs: [quality, unit-tests, e2e]
    if: >-
      github.ref == 'refs/heads/main'
      && (
        github.event_name == 'push'
        || (github.event_name == 'workflow_dispatch' && inputs.deploy_to_cloudflare)
      )
    runs-on: ubuntu-latest
    concurrency:
      group: production-collab
      cancel-in-progress: false
    environment:
      name: production
      url: https://collab.archlens.dev
    outputs:
      previous_version_id: ${{ steps.capture.outputs.previous_version_id }}
      previous_sha: ${{ steps.capture.outputs.previous_sha }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.10.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
        working-directory: app

      - name: Capture previous collab identity
        id: capture
        working-directory: app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec tsx scripts/deploySmoke/run.ts capture-collab

      - name: Deploy collab Worker
        working-directory: app/packages/collab
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --var GIT_SHA:${{ github.sha }}

      - name: Publish collab deploy summary
        if: always()
        env:
          PREVIOUS_ID: ${{ steps.capture.outputs.previous_version_id }}
        run: |
          {
            echo "## Collab Worker"
            echo "- **env:** production"
            echo "- **sha:** \`${GITHUB_SHA}\`"
            echo "- **url:** https://collab.archlens.dev"
            echo "- **health:** https://collab.archlens.dev/health"
            if [ -n "${PREVIOUS_ID}" ]; then
              echo "- **previous version:** \`${PREVIOUS_ID}\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  smoke:
    name: smoke
    needs: [deploy-cloudflare, deploy-collab]
    if: >-
      github.ref == 'refs/heads/main'
      && (
        github.event_name == 'push'
        || (github.event_name == 'workflow_dispatch' && inputs.deploy_to_cloudflare)
      )
    runs-on: ubuntu-latest
    concurrency:
      group: production-smoke
      cancel-in-progress: false
    environment:
      name: production
      url: https://archlens.dev
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.10.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
        working-directory: app

      - name: Smoke production and roll back on failure
        working-directory: app
        env:
          EXPECTED_SHA: ${{ github.sha }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PREVIOUS_DEPLOYMENT_ID: ${{ needs.deploy-cloudflare.outputs.previous_deployment_id }}
          PAGES_PREVIOUS_SHA: ${{ needs.deploy-cloudflare.outputs.previous_sha }}
          COLLAB_PREVIOUS_VERSION_ID: ${{ needs.deploy-collab.outputs.previous_version_id }}
          COLLAB_PREVIOUS_SHA: ${{ needs.deploy-collab.outputs.previous_sha }}
        run: pnpm exec tsx scripts/deploySmoke/run.ts smoke

  merge-gate:
    name: merge-gate
    needs: [quality, unit-tests, e2e, build, smoke]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require verify (and prod smoke on main deploy)
        env:
          QUALITY: ${{ needs.quality.result }}
          UNIT: ${{ needs.unit-tests.result }}
          E2E: ${{ needs.e2e.result }}
          BUILD: ${{ needs.build.result }}
          SMOKE: ${{ needs.smoke.result }}
          REF: ${{ github.ref }}
          EVENT: ${{ github.event_name }}
          DEPLOY: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_to_cloudflare }}
        run: |
          fail=0
          for name in QUALITY UNIT E2E BUILD; do
            eval "val=\${$name}"
            echo "$name=$val"
            if [ "$val" != "success" ]; then
              fail=1
            fi
          done
          echo "SMOKE=$SMOKE"
          main_deploy=0
          if [ "$REF" = "refs/heads/main" ] && { [ "$EVENT" = "push" ] || [ "$DEPLOY" = "true" ]; }; then
            main_deploy=1
          fi
          if [ "$main_deploy" = "1" ]; then
            if [ "$SMOKE" != "success" ]; then
              fail=1
            fi
          elif [ "$SMOKE" != "success" ] && [ "$SMOKE" != "skipped" ]; then
            fail=1
          fi
          exit "$fail"

  check-release:
    needs: [build, e2e]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    outputs:
      skip: ${{ steps.detect.outputs.skip }}
      release_cli: ${{ steps.detect.outputs.release_cli }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect CLI release
        id: detect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bin/release-cli.sh detect

  build-ts-cli-binaries:
    needs: check-release
    if: needs.check-release.outputs.release_cli == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.10.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
        working-directory: app

      - name: Resolve CLI release version
        id: cli_version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "tag=$(bin/release-cli.sh next-version)" >> "$GITHUB_OUTPUT"

      - name: Compile TS CLI Binaries
        env:
          ARCHLENS_VERSION: ${{ steps.cli_version.outputs.tag }}
        run: |
          bun app/packages/cli/scripts/emitBuildVersion.ts
          mkdir -p dist/linux dist/macos-x64 dist/macos-arm64 dist/windows
          bun build app/packages/cli/src/cli/archlens.ts --compile --target=bun-linux-x64 --outfile=dist/linux/archlens
          bun build app/packages/cli/src/cli/archlens.ts --compile --target=bun-darwin-x64 --outfile=dist/macos-x64/archlens
          bun build app/packages/cli/src/cli/archlens.ts --compile --target=bun-darwin-arm64 --outfile=dist/macos-arm64/archlens
          bun build app/packages/cli/src/cli/archlens.ts --compile --target=bun-windows-x64 --outfile=dist/windows/archlens.exe
          bun app/packages/cli/scripts/copyTreeSitterWasms.ts \
            dist/linux dist/macos-x64 dist/macos-arm64 dist/windows

      - name: Package Archives
        run: |
          mkdir -p dist/archives
          tar -czf dist/archives/archlens-linux-x64.tar.gz -C dist/linux .
          tar -czf dist/archives/archlens-macos-x64.tar.gz -C dist/macos-x64 .
          tar -czf dist/archives/archlens-macos-arm64.tar.gz -C dist/macos-arm64 .
          (cd dist/windows && zip -r ../archives/archlens-windows-x64.zip .)
          (cd dist/archives && sha256sum archlens-*.tar.gz archlens-*.zip > checksums.txt)
          cp dist/archives/checksums.txt dist/checksums.txt

      - name: Upload TS Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ts-cli-binaries
          path: dist/archives/

  publish-cli-release:
    needs: [check-release, build-ts-cli-binaries]
    if: needs.check-release.outputs.release_cli == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download TS Artifacts
        uses: actions/download-artifact@v8
        with:
          name: ts-cli-binaries
          path: dist

      - name: Publish CLI release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bin/release-cli.sh publish
