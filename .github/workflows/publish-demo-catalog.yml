name: Publish demo catalog

# Matrix dogfood: clone each example codebase → scan → fragment into shared samples estate.
# Each demo uses --context={id} so BlueprintSpec paths do not collide across repos.
# Cron safety net: compose-catalog.yml.

on:
  schedule:
    - cron: '0 6 * * 0' # 06:00 UTC Sundays
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-demo-catalog
  cancel-in-progress: false

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      samples: ${{ steps.set.outputs.samples }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Load demo catalog matrix
        id: set
        run: echo "samples=$(jq -c '.' scripts/blueprint-sample-repos.json)" >> "$GITHUB_OUTPUT"

  publish:
    needs: matrix
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.sample.timeoutMinutes }}
    environment:
      name: production
    strategy:
      fail-fast: false
      matrix:
        sample: ${{ fromJson(needs.matrix.outputs.samples) }}
    steps:
      - name: Checkout ArchLens
        uses: actions/checkout@v7

      - name: Setup ArchLens CLI
        uses: ./.github/actions/setup-archlens-cli

      - name: Clone demo repo
        run: |
          set -euo pipefail
          git clone --single-branch --depth=500 \
            "${{ matrix.sample.repo }}" \
            "demos/${{ matrix.sample.id }}"

      - name: Scan, publish fragment, and compose
        working-directory: demos/${{ matrix.sample.id }}
        env:
          OBJECT_STORAGE_PROVIDER: r2
          OBJECT_STORAGE_BUCKET: ${{ secrets.R2_BLUEPRINT_CATALOG_BUCKET }}
          OBJECT_STORAGE_KEY_PREFIX: estates/samples
          R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_BLUEPRINT_CATALOG_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_BLUEPRINT_CATALOG_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          DEMO_SHA="$(git rev-parse HEAD)"
          OUT="${GITHUB_WORKSPACE}/blueprints/${{ matrix.sample.id }}"

          # Context folder must match product id so demos do not share path prefixes.
          archlens scan --headless \
            --output="${OUT}" \
            --context="${{ matrix.sample.id }}" \
            --git-since="${{ matrix.sample.gitSinceDays }}"

          archlens catalog publish-fragment "${OUT}" \
            --estate=samples \
            --product="${{ matrix.sample.id }}" \
            --source-ref="${{ matrix.sample.repo }}@${DEMO_SHA}" \
            --key-prefix=estates/samples \
            --no-dry-run \
            --format=json

          archlens catalog compose \
            --estate=samples \
            --workspace-name=samples \
            --key-prefix=estates/samples \
            --no-dry-run \
            --format=json
