name: Lighthouse

on:
  schedule:
    - cron: '0 0 * * 0' # Every Sunday at 00:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lighthouse
  cancel-in-progress: true

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.10.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: resilience-engine/go.mod
          cache-dependency-path: resilience-engine/go.mod

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
        working-directory: app

      - name: Build production bundle for Lighthouse
        run: pnpm build:resilience-engine && pnpm --filter @archlens/designer build
        working-directory: app

      - name: Run Lighthouse CI
        run: pnpm --filter @archlens/designer test:lighthouse
        working-directory: app

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-report
          path: app/packages/designer/lighthouse-report/
          retention-days: 30
