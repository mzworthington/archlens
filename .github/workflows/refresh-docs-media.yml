name: Refresh docs & media

# Regenerate committed docs artifacts (schema, features report, changelog, guide GIFs)
# and push to main when anything changed. Local: bin/sync-derived.sh

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 0' # Sunday 06:00 UTC

permissions:
  contents: write

concurrency:
  group: refresh-docs-media
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      GIT_AUTHOR_NAME: github-actions[bot]
      GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
      GIT_COMMITTER_NAME: github-actions[bot]
      GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.10.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: resilience-engine/go.mod
          cache-dependency-path: resilience-engine/go.mod

      - name: Install media tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg ttyd
          go install github.com/charmbracelet/vhs@latest
          echo "${HOME}/go/bin" >> "${GITHUB_PATH}"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
        working-directory: app

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('app/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @archlens/designer exec playwright install --with-deps chromium
        working-directory: app

      - name: Refresh docs & media
        run: bin/sync-derived.sh
