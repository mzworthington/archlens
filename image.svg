<svg xmlns="http://www.w3.org/2000/svg" 
     viewBox="0 0 450 320" 
     width="450mm" 
     height="320mm">
  <title>RoMini Storybox - Sheet 1 (6.0mm Baltic Birch with Interlocking Finger Joints)</title>

  <!-- ==================== FRONT PANEL (130 x 130mm with Finger Joints) ==================== -->
  <g id="FRONT_PANEL_FINGER_JOINTS" transform="translate(10, 10)">
    <!-- Interlocking perimeter path: 13mm fingers, 6mm depth -->
    <path d="
      M 6,0 
      L 19,0 L 19,6 L 32,6 L 32,0 L 45,0 L 45,6 L 58,6 L 58,0 L 71,0 L 71,6 L 84,6 L 84,0 L 97,0 L 97,6 L 110,6 L 110,0 L 124,0
      L 124,6 L 130,6 L 130,19 L 124,19 L 124,32 L 130,32 L 130,45 L 124,45 L 124,58 L 130,58 L 130,71 L 124,71 L 124,84 L 130,84 L 130,97 L 124,97 L 124,110 L 130,110 L 130,124 L 124,124
      L 124,130 L 110,130 L 110,124 L 97,124 L 97,130 L 84,130 L 84,124 L 71,124 L 71,130 L 58,130 L 58,124 L 45,124 L 45,130 L 32,130 L 32,124 L 19,124 L 19,130 L 6,130
      L 6,124 L 0,124 L 0,110 L 6,110 L 6,97 L 0,97 L 0,84 L 6,84 L 6,71 L 0,71 L 0,58 L 6,58 L 6,45 L 0,45 L 0,32 L 6,32 L 6,19 L 0,19 L 0,6 L 6,6 Z
    " fill="none" stroke="#FF0000" stroke-width="0.2"/>

    <!-- 90x90mm Centered Window Cutout -->
    <rect x="20" y="20" width="90" height="90" rx="1.5" fill="none" stroke="#FF0000" stroke-width="0.2"/>
    <!-- Baffle Alignment Guideline -->
    <rect x="14" y="14" width="102" height="102" fill="none" stroke="#00FFFF" stroke-width="0.1" stroke-dasharray="2 1"/>
  </g>

  <!-- ==================== REAR INPUT PANEL (130 x 130mm with Finger Joints) ==================== -->
  <g id="REAR_PANEL_FINGER_JOINTS" transform="translate(160, 10)">
    <!-- Mating finger joint perimeter path -->
    <path d="
      M 6,0 
      L 19,0 L 19,6 L 32,6 L 32,0 L 45,0 L 45,6 L 58,6 L 58,0 L 71,0 L 71,6 L 84,6 L 84,0 L 97,0 L 97,6 L 110,6 L 110,0 L 124,0
      L 124,6 L 130,6 L 130,19 L 124,19 L 124,32 L 130,32 L 130,45 L 124,45 L 124,58 L 130,58 L 130,71 L 124,71 L 124,84 L 130,84 L 130,97 L 124,97 L 124,110 L 130,110 L 130,124 L 124,124
      L 124,130 L 110,130 L 110,124 L 97,124 L 97,130 L 84,130 L 84,124 L 71,124 L 71,130 L 58,130 L 58,124 L 45,124 L 45,130 L 32,130 L 32,124 L 19,124 L 19,130 L 6,130
      L 6,124 L 0,124 L 0,110 L 6,110 L 6,97 L 0,97 L 0,84 L 6,84 L 6,71 L 0,71 L 0,58 L 6,58 L 6,45 L 0,45 L 0,32 L 6,32 L 6,19 L 0,19 L 0,6 L 6,6 Z
    " fill="none" stroke="#FF0000" stroke-width="0.2"/>

    <!-- 22mm Diameter USB-C Port (Lower-Left Corner) -->
    <circle cx="25" cy="105" r="11.0" fill="none" stroke="#FF0000" stroke-width="0.2"/>
    <!-- 16mm Diameter Pushbutton Port (Lower-Right Corner) -->
    <circle cx="105" cy="105" r="8.0" fill="none" stroke="#FF0000" stroke-width="0.2"/>
    <!-- Upper Passive Exhaust Slits (35 x 4mm) -->
    <rect x="25" y="15" width="35" height="4" rx="2" fill="none" stroke="#FF0000" stroke-width="0.2"/>
    <rect x="70" y="15" width="35" height="4" rx="2" fill="none" stroke="#FF0000" stroke-width="0.2"/>
  </g>

  <!-- ==================== SIDE WALL LEFT (Mating Joints) ==================== -->
  <g id="SIDE_LEFT_FINGER_JOINTS" transform="translate(10, 160)">
    <!-- Alternating mating perimeter: slots where front/rear have tabs -->
    <path d="
      M 0,6 
      L 6,6 L 6,19 L 0,19 L 0,32 L 6,32 L 6,45 L 0,45 L 0,58 L 6,58 L 6,71 L 0,71 L 0,84 L 6,84 L 6,97 L 0,97 L 0,110 L 6,110 L 6,124 L 0,124
      L 6,124 L 6,130 L 19,130 L 19,124 L 32,124 L 32,130 L 45,130 L 45,124 L 58,124 L 58,130 L 71,130 L 71,124 L 84,124 L 84,130 L 97,130 L 97,124 L 110,124 L 110,130 L 124,130
      L 124,124 L 130,124 L 130,110 L 124,110 L 124,97 L 130,97 L 130,84 L 124,84 L 124,71 L 130,71 L 130,58 L 124,58 L 124,45 L 130,45 L 130,32 L 124,32 L 124,19 L 130,19 L 130,6 L 124,6
      L 124,0 L 110,0 L 110,6 L 97,6 L 97,0 L 84,0 L 84,6 L 71,6 L 71,0 L 58,0 L 58,6 L 45,6 L 45,0 L 32,0 L 32,6 L 19,6 L 19,0 L 6,0 L 6,6 Z
    " fill="none" stroke="#FF0000" stroke-width="0.2"/>
  </g>

  <!-- ==================== SIDE WALL RIGHT (Mating Joints) ==================== -->
  <g id="SIDE_RIGHT_FINGER_JOINTS" transform="translate(160, 160)">
    <path d="
      M 0,6 
      L 6,6 L 6,19 L 0,19 L 0,32 L 6,32 L 6,45 L 0,45 L 0,58 L 6,58 L 6,71 L 0,71 L 0,84 L 6,84 L 6,97 L 0,97 L 0,110 L 6,110 L 6,124 L 0,124
      L 6,124 L 6,130 L 19,130 L 19,124 L 32,124 L 32,130 L 45,130 L 45,124 L 58,124 L 58,130 L 71,130 L 71,124 L 84,124 L 84,130 L 97,130 L 97,124 L 110,124 L 110,130 L 124,130
      L 124,124 L 130,124 L 130,110 L 124,110 L 124,97 L 130,97 L 130,84 L 124,84 L 124,71 L 130,71 L 130,58 L 124,58 L 124,45 L 130,45 L 130,32 L 124,32 L 124,19 L 130,19 L 130,6 L 124,6
      L 124,0 L 110,0 L 110,6 L 97,6 L 97,0 L 84,0 L 84,6 L 71,6 L 71,0 L 58,0 L 58,6 L 45,6 L 45,0 L 32,0 L 32,6 L 19,6 L 19,0 L 6,0 L 6,6 Z
    " fill="none" stroke="#FF0000" stroke-width="0.2"/>
  </g>

  <!-- ==================== REMOVABLE BASE SLED (118 x 118mm Square Sled) ==================== -->
  <g id="BASE_SLED_6MM" transform="translate(310, 10)">
    <!-- Base sled does NOT have finger joints: it slides flush into the 118mm interior cavity -->
    <rect x="0" y="0" width="118" height="118" rx="2.0" fill="none" stroke="#FF0000" stroke-width="0.2"/>
    <!-- 4x Corner M3 Cleat Attachment Holes (3.2mm Through, 90deg Countersink) -->
    <circle cx="6" cy="6" r="1.6" fill="none" stroke="#00FF00" stroke-width="0.2"/>
    <circle cx="112" cy="6" r="1.6" fill="none" stroke="#00FF00" stroke-width="0.2"/>
    <circle cx="6" cy="112" r="1.6" fill="none" stroke="#00FF00" stroke-width="0.2"/>
    <circle cx="112" cy="112" r="1.6" fill="none" stroke="#00FF00" stroke-width="0.2"/>
    <!-- 4x M2.5 Centralized Pi 4 Standoff Holes (58 x 49mm Pattern) -->
    <circle cx="30" cy="34.5" r="1.35" fill="none" stroke="#00FF00" stroke-width="0.2"/>
    <circle cx="88" cy="34.5" r="1.35" fill="none" stroke="#00FF00" stroke-width="0.2"/>
    <circle cx="30" cy="83.5" r="1.35" fill="none" stroke="#00FF00" stroke-width="0.2"/>
    <circle cx="88" cy="83.5" r="1.35" fill="none" stroke="#00FF00" stroke-width="0.2"/>
  </g>
</svg>
