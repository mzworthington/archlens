apiVersion: blueprint.dev/v4
kind: Diagram
metadata:
  name: ChaosLens — Deep Dependency Chain
  entityRef: blueprint/chaoslens-stress/deep-chain
spec:
  level: container
  nodes:
    - entityRef: blueprint/chaoslens-stress/deep-chain/entry
      type: web-app
      name: Entry Point
    - entityRef: blueprint/chaoslens-stress/deep-chain/hop-01
      type: microservice
      name: Hop 01
    - entityRef: blueprint/chaoslens-stress/deep-chain/hop-02
      type: microservice
      name: Hop 02
    - entityRef: blueprint/chaoslens-stress/deep-chain/hop-03
      type: microservice
      name: Hop 03
    - entityRef: blueprint/chaoslens-stress/deep-chain/hop-04
      type: microservice
      name: Hop 04
    - entityRef: blueprint/chaoslens-stress/deep-chain/hop-05
      type: microservice
      name: Hop 05
    - entityRef: blueprint/chaoslens-stress/deep-chain/hop-06
      type: microservice
      name: Hop 06
    - entityRef: blueprint/chaoslens-stress/deep-chain/hop-07
      type: microservice
      name: Hop 07
    - entityRef: blueprint/chaoslens-stress/deep-chain/hop-08
      type: microservice
      name: Hop 08
    - entityRef: blueprint/chaoslens-stress/deep-chain/hop-09
      type: microservice
      name: Hop 09
    - entityRef: blueprint/chaoslens-stress/deep-chain/leaf
      type: database
      name: Leaf Database
  dependencies:
    - from: blueprint/chaoslens-stress/deep-chain/entry
      to: blueprint/chaoslens-stress/deep-chain/hop-01
      type: direct-call
    - from: blueprint/chaoslens-stress/deep-chain/hop-01
      to: blueprint/chaoslens-stress/deep-chain/hop-02
      type: direct-call
    - from: blueprint/chaoslens-stress/deep-chain/hop-02
      to: blueprint/chaoslens-stress/deep-chain/hop-03
      type: direct-call
    - from: blueprint/chaoslens-stress/deep-chain/hop-03
      to: blueprint/chaoslens-stress/deep-chain/hop-04
      type: direct-call
    - from: blueprint/chaoslens-stress/deep-chain/hop-04
      to: blueprint/chaoslens-stress/deep-chain/hop-05
      type: direct-call
    - from: blueprint/chaoslens-stress/deep-chain/hop-05
      to: blueprint/chaoslens-stress/deep-chain/hop-06
      type: direct-call
    - from: blueprint/chaoslens-stress/deep-chain/hop-06
      to: blueprint/chaoslens-stress/deep-chain/hop-07
      type: direct-call
    - from: blueprint/chaoslens-stress/deep-chain/hop-07
      to: blueprint/chaoslens-stress/deep-chain/hop-08
      type: direct-call
    - from: blueprint/chaoslens-stress/deep-chain/hop-08
      to: blueprint/chaoslens-stress/deep-chain/hop-09
      type: direct-call
    - from: blueprint/chaoslens-stress/deep-chain/hop-09
      to: blueprint/chaoslens-stress/deep-chain/leaf
      type: read-write
