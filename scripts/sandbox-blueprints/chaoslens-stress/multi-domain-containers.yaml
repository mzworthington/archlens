# yaml-language-server: $schema=https://archlens.dev/schemas/latest/blueprint.schema.json
version: https://archlens.dev/schemas/v4/blueprint.schema.json
level: container
metadata:
  entityRef: blueprint/chaoslens-stress/multi-domain
  name: ChaosLens - Multi-Domain Cross-Cutting
  description: >
    Shop, billing, and auth domains share a payment service. Stress-tests
    impacted-domain telemetry and cross-domain blast radius when faulting the
    shared dependency.
nodes:
  - entityRef: shop/web
    type: web-app
    name: Shop Web
  - entityRef: shop/api
    type: rest-api
    name: Shop API
  - entityRef: billing/portal
    type: web-app
    name: Billing Portal
  - entityRef: billing/ledger
    type: microservice
    name: Ledger Service
  - entityRef: auth/sso
    type: rest-api
    name: SSO Service
  - entityRef: shared/payment
    type: microservice
    name: Shared Payment
  - entityRef: shared/payment-db
    type: database
    name: Payment Database
dependencies:
  - from: shop/web
    to: shop/api
    type: direct-call
  - from: shop/api
    to: shared/payment
    type: direct-call
  - from: billing/portal
    to: billing/ledger
    type: direct-call
  - from: billing/ledger
    to: shared/payment
    type: direct-call
  - from: auth/sso
    to: shared/payment
    type: direct-call
  - from: shared/payment
    to: shared/payment-db
    type: read-write
