# yaml-language-server: $schema=https://archlens.dev/schemas/latest/blueprint.schema.json
version: https://archlens.dev/schemas/v4/blueprint.schema.json
level: container
metadata:
  entityRef: golden-paths/golden-journey/identity-platform
  name: Identity Platform
  description: >
    Member sign-in and SSO session handoff into checkout within the estate context window.
nodes:
  - entityRef: golden-paths/golden-journey/identity-platform/sso-api
    type: rest-api
    name: SSO API
    forensics:
      complexity: 10
      loc: 380
      sloc: 280
      churn: 0.14
      churn30: 10
      churn365: 72
      churnByWeek: [1, 1, 2, 2, 2, 2, 3, 3]
      authorCount: 2
      topAuthorPercent: 0.68
      hotspotScore: 0.16
      classifications: []
      sinceDays: 365
  - entityRef: golden-paths/golden-journey/identity-platform/session-store
    type: database
    name: Session Store
dependencies:
  - from: golden-paths/golden-journey/identity-platform/sso-api
    to: golden-paths/golden-journey/identity-platform/session-store
    type: read-write
    description: Token and session persistence
