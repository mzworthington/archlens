# Merged into blueprints/advicelens-stress/context.yaml after batch scans (see scripts/merge-sandbox-context.mjs).
nodes:
  - entityRef: advicelens-stress
    type: group
    name: AdviceLens Stress Tests
    properties:
      rootPath: advicelens-stress
      productId: advicelens-stress
  - entityRef: advicelens-stress/composite-risk
    type: software-system
    name: Composite Risk (hotspot × blast)
    parentEntityRef: advicelens-stress
    properties:
      rootPath: advicelens-stress
      productId: advicelens-stress
  - entityRef: advicelens-stress/knowledge-silo
    type: software-system
    name: Knowledge Silo Cluster
    parentEntityRef: advicelens-stress
    properties:
      rootPath: advicelens-stress
      productId: advicelens-stress
  - entityRef: advicelens-stress/pubsub-staleness
    type: software-system
    name: Pub/Sub Staleness
    parentEntityRef: advicelens-stress
    properties:
      rootPath: advicelens-stress
      productId: advicelens-stress
  - entityRef: advicelens-stress/code-rollup
    type: software-system
    name: Code Roll-up (component drill-down)
    parentEntityRef: advicelens-stress
    properties:
      rootPath: advicelens-stress
      productId: advicelens-stress
  - entityRef: advicelens-stress/payment-processor
    type: gateway-api
    name: Payment Processor
    external: true
    properties:
      vendor: Stripe-compatible PSP
      classification: third-party
dependencies:
  - from: advicelens-stress/user
    to: advicelens-stress
    type: direct-call
    description: Reviews architecture advice
  - from: advicelens-stress
    to: advicelens-stress/payment-processor
    type: direct-call
    description: Checkout and billing payments
