# yaml-language-server: $schema=https://archlens.dev/schemas/latest/blueprint.schema.json
version: https://archlens.dev/schemas/v4/blueprint.schema.json
level: container
metadata:
  entityRef: samples/golden-journey
  name: Golden Journey Estate
  description: >
    Context-window estate for the day-in-the-life tour. Related product areas (catalog,
    identity, checkout, billing) share a third-party Payment Gateway. Each area is a group
    Each area is a group boundary - use Zoom on a platform group or API to open its
    container and component diagrams (checkout Payment Client hotspot, billing retry fan-in).
nodes:
  - entityRef: samples/golden-journey/shopper
    type: person
    name: Shopper
    properties:
      role: product-persona
      product: catalog
  - entityRef: samples/golden-journey/member
    type: person
    name: Member
    properties:
      role: product-persona
      product: identity
  - entityRef: samples/golden-journey/buyer
    type: person
    name: Buyer
    properties:
      role: product-persona
      product: checkout
  - entityRef: samples/golden-journey/subscriber
    type: person
    name: Subscriber
    properties:
      role: product-persona
      product: billing
  - entityRef: samples/golden-journey/web
    type: web-app
    name: Web Storefront
  - entityRef: samples/golden-journey/mobile
    type: mobile-app
    name: Mobile App
  - entityRef: samples/golden-journey/catalog-platform
    type: group
    name: Catalog Platform
  - entityRef: samples/golden-journey/catalog-platform/catalog-api
    type: rest-api
    name: Catalog API
    parentEntityRef: samples/golden-journey/catalog-platform
    forensics:
      complexity: 12
      loc: 480
      sloc: 360
      churn: 0.18
      churn30: 14
      churn365: 96
      churnByWeek: [2, 2, 2, 3, 3, 3, 4, 4]
      authorCount: 3
      topAuthorPercent: 0.55
      hotspotScore: 0.2
      classifications: []
      sinceDays: 365
  - entityRef: samples/golden-journey/identity-platform
    type: group
    name: Identity Platform
  - entityRef: samples/golden-journey/identity-platform/sso-api
    type: rest-api
    name: SSO API
    parentEntityRef: samples/golden-journey/identity-platform
    forensics:
      complexity: 10
      loc: 380
      sloc: 280
      churn: 0.14
      churn30: 10
      churn365: 72
      churnByWeek: [1, 1, 2, 2, 2, 2, 3, 3]
      authorCount: 2
      topAuthorPercent: 0.68
      hotspotScore: 0.16
      classifications: []
      sinceDays: 365
  - entityRef: samples/golden-journey/checkout-platform
    type: group
    name: Checkout Platform
  - entityRef: samples/golden-journey/checkout-platform/checkout-api
    type: rest-api
    name: Checkout API
    parentEntityRef: samples/golden-journey/checkout-platform
    forensics:
      complexity: 28
      loc: 1120
      sloc: 840
      churn: 0.48
      churn30: 62
      churn365: 420
      churnByWeek: [6, 8, 10, 12, 14, 16, 18, 20]
      authorCount: 3
      topAuthorPercent: 0.58
      hotspotScore: 0.44
      classifications: [hotspot]
      sinceDays: 365
  - entityRef: samples/golden-journey/billing-platform
    type: group
    name: Billing Platform
  - entityRef: samples/golden-journey/billing-platform/billing-worker
    type: background-worker
    name: Billing Worker
    parentEntityRef: samples/golden-journey/billing-platform
    forensics:
      complexity: 14
      loc: 520
      sloc: 380
      churn: 0.22
      churn30: 18
      churn365: 120
      churnByWeek: [2, 2, 3, 3, 4, 4, 5, 5]
      authorCount: 2
      topAuthorPercent: 0.72
      hotspotScore: 0.28
      classifications: []
      sinceDays: 365
  - entityRef: samples/golden-journey/payment-gateway
    type: gateway-api
    name: Payment Gateway
    external: true
    properties:
      vendor: Stripe-compatible PSP
      classification: third-party
dependencies:
  - from: samples/golden-journey/shopper
    to: samples/golden-journey/web
    type: direct-call
    description: Browse catalog
  - from: samples/golden-journey/shopper
    to: samples/golden-journey/mobile
    type: direct-call
    description: Browse catalog
  - from: samples/golden-journey/shopper
    to: samples/golden-journey/catalog-platform
    type: direct-call
    description: Discover products
  - from: samples/golden-journey/member
    to: samples/golden-journey/identity-platform
    type: direct-call
    description: Sign in
  - from: samples/golden-journey/buyer
    to: samples/golden-journey/web
    type: direct-call
    description: Checkout journey
  - from: samples/golden-journey/buyer
    to: samples/golden-journey/mobile
    type: direct-call
    description: Checkout journey
  - from: samples/golden-journey/buyer
    to: samples/golden-journey/checkout-platform
    type: direct-call
    description: Complete purchase
  - from: samples/golden-journey/subscriber
    to: samples/golden-journey/billing-platform
    type: direct-call
    description: Renew subscription
  - from: samples/golden-journey/web
    to: samples/golden-journey/catalog-platform
    type: direct-call
    description: Browse catalog
  - from: samples/golden-journey/mobile
    to: samples/golden-journey/catalog-platform
    type: direct-call
    description: Browse catalog
  - from: samples/golden-journey/web
    to: samples/golden-journey/checkout-platform
    type: direct-call
    description: Checkout journey
  - from: samples/golden-journey/mobile
    to: samples/golden-journey/checkout-platform
    type: direct-call
    description: Checkout journey
  - from: samples/golden-journey/catalog-platform/catalog-api
    to: samples/golden-journey/checkout-platform/checkout-api
    type: direct-call
    description: Add to cart → checkout
  - from: samples/golden-journey/identity-platform/sso-api
    to: samples/golden-journey/checkout-platform/checkout-api
    type: direct-call
    description: Session handoff
  - from: samples/golden-journey/checkout-platform/checkout-api
    to: samples/golden-journey/payment-gateway
    type: direct-call
  - from: samples/golden-journey/billing-platform/billing-worker
    to: samples/golden-journey/payment-gateway
    type: direct-call
