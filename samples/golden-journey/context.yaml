# yaml-language-server: $schema=https://archlens.dev/schemas/latest/blueprint.schema.json
version: https://archlens.dev/schemas/v4/blueprint.schema.json
level: context
metadata:
  entityRef: samples
  name: Samples
  description: >
    Product personas for the day-in-the-life golden journey - shoppers browse the catalog,
    members sign in, buyers checkout and subscribers renew through a shared estate.
nodes:
  - entityRef: samples/golden-journey/shopper
    type: person
    name: Shopper
    properties:
      role: product-persona
      product: catalog
  - entityRef: samples/golden-journey/member
    type: person
    name: Member
    properties:
      role: product-persona
      product: identity
  - entityRef: samples/golden-journey/buyer
    type: person
    name: Buyer
    properties:
      role: product-persona
      product: checkout
  - entityRef: samples/golden-journey/subscriber
    type: person
    name: Subscriber
    properties:
      role: product-persona
      product: billing
  - entityRef: samples/golden-journey
    type: software-system
    name: Golden Journey
    properties:
      rootPath: golden-journey
      productId: golden-journey
  - entityRef: samples/golden-journey/payment-gateway
    type: gateway-api
    name: Payment Gateway
    external: true
    properties:
      vendor: Stripe-compatible PSP
      classification: third-party
dependencies:
  - from: samples/golden-journey/shopper
    to: samples/golden-journey
    type: direct-call
    description: Browse catalog
  - from: samples/golden-journey/member
    to: samples/golden-journey
    type: direct-call
    description: Sign in across products
  - from: samples/golden-journey/buyer
    to: samples/golden-journey
    type: direct-call
    description: Complete purchase
  - from: samples/golden-journey/subscriber
    to: samples/golden-journey
    type: direct-call
    description: Manage subscription renewals
  - from: samples/golden-journey
    to: samples/golden-journey/payment-gateway
    type: direct-call
    description: Checkout and billing payments
