# yaml-language-server: $schema=https://archlens.dev/schemas/latest/blueprint.schema.json
version: https://archlens.dev/schemas/v4/blueprint.schema.json
level: container
metadata:
  entityRef: samples/golden-journey/checkout-platform
  name: Checkout Platform
  description: >
    Purchase flow inside the estate — Checkout API calls the shared Payment Gateway.
    Zoom here from the group boundary on the estate canvas.
nodes:
  - entityRef: samples/golden-journey/checkout-platform/checkout-api
    type: rest-api
    name: Checkout API
    forensics:
      complexity: 28
      loc: 1120
      sloc: 840
      churn: 0.48
      churn30: 62
      churn365: 420
      churnByWeek: [6, 8, 10, 12, 14, 16, 18, 20]
      authorCount: 3
      topAuthorPercent: 0.58
      hotspotScore: 0.44
      classifications: [hotspot]
      sinceDays: 365
  - entityRef: samples/golden-journey/checkout-platform/order-events
    type: event-broker
    name: Order Events
  - entityRef: samples/golden-journey/payment-gateway
    type: gateway-api
    name: Payment Gateway
    external: true
    properties:
      vendor: Stripe-compatible PSP
      classification: third-party
dependencies:
  - from: samples/golden-journey/checkout-platform/checkout-api
    to: samples/golden-journey/checkout-platform/order-events
    type: publish-subscribe
    description: Order placed events
  - from: samples/golden-journey/checkout-platform/checkout-api
    to: samples/golden-journey/payment-gateway
    type: direct-call
