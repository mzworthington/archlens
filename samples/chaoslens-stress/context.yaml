# yaml-language-server: $schema=https://archlens.dev/schemas/latest/blueprint.schema.json
version: https://archlens.dev/schemas/v4/blueprint.schema.json
level: context
metadata:
  entityRef: chaoslens-stress
  name: ChaosLens Stress Tests
  description: Architecture diagrams for stress-testing ChaosLens simulations.
nodes:
  - entityRef: chaoslens-stress/user
    type: person
    name: User
    properties:
      role: context-actor
  - entityRef: chaoslens-stress/scenarios
    type: group
    name: ChaosLens Stress Tests
    properties:
      rootPath: chaoslens-stress
      productId: chaoslens-stress
  - entityRef: chaoslens-stress/ecommerce
    type: software-system
    name: E-Commerce SPOF
    parentEntityRef: chaoslens-stress/scenarios
    properties:
      rootPath: chaoslens-stress
      productId: chaoslens-stress
  - entityRef: chaoslens-stress/deep-chain
    type: software-system
    name: Deep Dependency Chain
    parentEntityRef: chaoslens-stress/scenarios
    properties:
      rootPath: chaoslens-stress
      productId: chaoslens-stress
  - entityRef: chaoslens-stress/shared-hub
    type: software-system
    name: Shared Hub Fan-Out
    parentEntityRef: chaoslens-stress/scenarios
    properties:
      rootPath: chaoslens-stress
      productId: chaoslens-stress
  - entityRef: chaoslens-stress/safeguards
    type: software-system
    name: Safeguards Playground
    parentEntityRef: chaoslens-stress/scenarios
    properties:
      rootPath: chaoslens-stress
      productId: chaoslens-stress
  - entityRef: chaoslens-stress/group-boundary
    type: software-system
    name: Group Boundary Expansion
    parentEntityRef: chaoslens-stress/scenarios
    properties:
      rootPath: chaoslens-stress
      productId: chaoslens-stress
  - entityRef: chaoslens-stress/multi-domain
    type: software-system
    name: Multi-Domain Cross-Cutting
    parentEntityRef: chaoslens-stress/scenarios
    properties:
      rootPath: chaoslens-stress
      productId: chaoslens-stress
  - entityRef: chaoslens-stress/diamond
    type: software-system
    name: Diamond DAG
    parentEntityRef: chaoslens-stress/scenarios
    properties:
      rootPath: chaoslens-stress
      productId: chaoslens-stress
  - entityRef: chaoslens-stress/large-graph
    type: software-system
    name: Large Graph (Monte Carlo)
    parentEntityRef: chaoslens-stress/scenarios
    properties:
      rootPath: chaoslens-stress
      productId: chaoslens-stress
  - entityRef: chaoslens-stress/external-scope
    type: software-system
    name: External Simulation Scope
    parentEntityRef: chaoslens-stress/scenarios
    properties:
      rootPath: chaoslens-stress
      productId: chaoslens-stress
  - entityRef: chaoslens-stress/external-auth/auth
    type: microservice
    name: Auth Service (External)
    external: true
    properties:
      vendor: Sibling workspace diagram
      classification: cross-diagram
dependencies:
  - from: chaoslens-stress/external-scope
    to: chaoslens-stress/external-auth/auth
    type: direct-call
    description: Token validation via sibling Auth diagram
  - from: chaoslens-stress/user
    to: chaoslens-stress/scenarios
    type: direct-call
    description: Runs fault injection scenarios
