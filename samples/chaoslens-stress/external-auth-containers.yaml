# yaml-language-server: $schema=https://archlens.dev/schemas/latest/blueprint.schema.json
version: https://archlens.dev/schemas/v4/blueprint.schema.json
level: container
metadata:
  entityRef: chaoslens-stress/external-auth
  name: ChaosLens - External Auth (workspace sibling)
  description: >
    Sibling container for the External Simulation Scope scenario. Not shown on the
    storefront diagram until ChaosLens materializes it during Simulate. Auth depends
    on Session DB in this home diagram - fault the DB to see blast radius cross the
    proxy boundary back to the storefront.
nodes:
  - entityRef: chaoslens-stress/external-auth/auth
    type: microservice
    name: Auth Service
  - entityRef: chaoslens-stress/external-auth/session-db
    type: database
    name: Session DB
dependencies:
  - from: chaoslens-stress/external-auth/auth
    to: chaoslens-stress/external-auth/session-db
    type: read-write
    description: Token/session persistence behind the cross-diagram proxy
