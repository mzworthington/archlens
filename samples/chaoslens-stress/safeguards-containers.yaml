# yaml-language-server: $schema=https://archlens.dev/schemas/latest/blueprint.schema.json
version: https://archlens.dev/schemas/v4/blueprint.schema.json
level: container
metadata:
  entityRef: chaoslens-stress/safeguards
  name: ChaosLens - Safeguards Playground
  description: >
    Preset resilience YAML on nodes (sibling to forensics). Enter Resilience mode
    to see emerald borders and CB/BH/RT/LC badges. Gateway=circuitBreaker,
    BFF=bulkhead, Catalog=localCache, Checkout=retry+localCache combo.
    Web, Payment, and Ledger DB are unguarded for contrast. Fault ledger-db to watch
    bulkhead contain propagation at the BFF.
nodes:
  - entityRef: chaoslens-stress/safeguards/web
    type: web-app
    name: Web Client (unguarded)
  - entityRef: chaoslens-stress/safeguards/gateway
    type: gateway-api
    name: Edge Gateway
    resilience:
      circuitBreaker: true
  - entityRef: chaoslens-stress/safeguards/bff
    type: rest-api
    name: BFF Layer
    resilience:
      bulkhead: true
  - entityRef: chaoslens-stress/safeguards/catalog
    type: microservice
    name: Catalog Service
    resilience:
      localCache: true
  - entityRef: chaoslens-stress/safeguards/checkout
    type: microservice
    name: Checkout Service
    resilience:
      retry: true
      localCache: true
  - entityRef: chaoslens-stress/safeguards/payment
    type: microservice
    name: Payment Service (unguarded)
  - entityRef: chaoslens-stress/safeguards/ledger-db
    type: database
    name: Ledger Database (unguarded)
dependencies:
  - from: chaoslens-stress/safeguards/web
    to: chaoslens-stress/safeguards/gateway
    type: direct-call
  - from: chaoslens-stress/safeguards/gateway
    to: chaoslens-stress/safeguards/bff
    type: direct-call
  - from: chaoslens-stress/safeguards/bff
    to: chaoslens-stress/safeguards/catalog
    type: direct-call
  - from: chaoslens-stress/safeguards/bff
    to: chaoslens-stress/safeguards/checkout
    type: direct-call
  - from: chaoslens-stress/safeguards/checkout
    to: chaoslens-stress/safeguards/payment
    type: direct-call
  - from: chaoslens-stress/safeguards/payment
    to: chaoslens-stress/safeguards/ledger-db
    type: read-write
