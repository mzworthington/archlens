# yaml-language-server: $schema=https://archlens.dev/schemas/latest/chaos.schema.json
version: https://archlens.dev/schemas/v1/chaos.schema.json

metadata:
  name: Large graph orders domain outage
  description: Partial blast radius on a 50+ node topology — retail BFF circuit breaker should contain heat while other entry points stay healthy.
  diagramRef: chaoslens-stress/large-graph

faults:
  - nodeId: chaoslens-stress/large-graph/domain-orders
    faultType: region-outage

safeguards:
  chaoslens-stress/large-graph/bff-retail:
    circuitBreaker: true

monteCarlo:
  iterations: 500
  severityJitter: 0.1
  seed: 7
