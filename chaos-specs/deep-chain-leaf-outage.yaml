# yaml-language-server: $schema=https://archlens.dev/schemas/latest/chaos.schema.json
version: https://archlens.dev/schemas/v1/chaos.schema.json

metadata:
  name: Deep chain leaf outage
  description: Ten-hop linear chain with bulkhead at hop-05 — leaf region outage should be contained before the entry point degrades.
  diagramRef: chaoslens-stress/deep-chain

faults:
  - nodeId: chaoslens-stress/deep-chain/leaf
    faultType: region-outage

safeguards:
  chaoslens-stress/deep-chain/hop-05:
    bulkhead: true
