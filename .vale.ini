StylesPath = .github/styles
MinAlertLevel = suggestion
Packages = Google
Vocab = ArchLens

# Google and Custom apply to the Diátaxis trees and the pages that already
# pass. Widen to [*.md] after the rest of the corpus is clean.
# Google.WordListCase maps "touch" to "tap", which is wrong for git commits,
# so that rule is off here.
[docs/tutorials/*.md]
BasedOnStyles = Vale, Google, Custom
Google.Headings = warning
Google.Passive = suggestion
Google.WordListCase = NO

[docs/how-to/*.md]
BasedOnStyles = Vale, Google, Custom
Google.Headings = warning
Google.Passive = suggestion
Google.WordListCase = NO

[docs/reference/*.md]
BasedOnStyles = Vale, Google, Custom
Google.Headings = warning
Google.Passive = suggestion
Google.WordListCase = NO

[docs/explanation/*.md]
BasedOnStyles = Vale, Google, Custom
Google.Headings = warning
Google.Passive = suggestion
Google.WordListCase = NO

[docs/guide/{advicelens,chaos-spec,chaoslens,ci-workflows,collaborate,index,jobs,tracelens,vscode}.md]
BasedOnStyles = Vale, Google, Custom
Google.Headings = warning
Google.Passive = suggestion
Google.WordListCase = NO

