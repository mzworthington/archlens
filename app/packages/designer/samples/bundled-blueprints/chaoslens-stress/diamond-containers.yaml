# yaml-language-server: $schema=https://archlens.dev/schemas/latest/blueprint.schema.json
version: https://archlens.dev/schemas/v4/blueprint.schema.json
level: container
metadata:
  entityRef: chaoslens-stress/diamond
  name: ChaosLens - Diamond DAG
  description: >
    Entry fans out to two parallel services that reconverge on a shared
    aggregator. Stress-tests heat merging when multiple propagation paths
    reach the same upstream caller.
nodes:
  - entityRef: chaoslens-stress/diamond/entry
    type: web-app
    name: Entry Point
  - entityRef: chaoslens-stress/diamond/service-a
    type: microservice
    name: Service A
  - entityRef: chaoslens-stress/diamond/service-b
    type: microservice
    name: Service B
  - entityRef: chaoslens-stress/diamond/aggregator
    type: microservice
    name: Aggregator
    resilience:
      localCache: true
  - entityRef: chaoslens-stress/diamond/cache
    type: database
    name: Shared Cache
dependencies:
  - from: chaoslens-stress/diamond/entry
    to: chaoslens-stress/diamond/service-a
    type: direct-call
  - from: chaoslens-stress/diamond/entry
    to: chaoslens-stress/diamond/service-b
    type: direct-call
  - from: chaoslens-stress/diamond/service-a
    to: chaoslens-stress/diamond/aggregator
    type: direct-call
  - from: chaoslens-stress/diamond/service-b
    to: chaoslens-stress/diamond/aggregator
    type: direct-call
  - from: chaoslens-stress/diamond/aggregator
    to: chaoslens-stress/diamond/cache
    type: read-write
