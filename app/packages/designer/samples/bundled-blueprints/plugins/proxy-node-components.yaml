    external: true
    properties:
      filepath: plugins/proxy-backend/src/service/router.ts
      containerId: proxy-backend
      technology: REST Controller / Router
      classification: api-marker
    position:
      x: 560
      y: -204
dependencies:
  - from: backstage/plugins/proxy-backend/index
    to: backstage/plugins/proxy-node/alpha
    type: direct-call
    description: '@backstage/plugin-proxy-node'
  - from: backstage/plugins/proxy-backend/plugin
    to: backstage/plugins/proxy-node/alpha
    type: direct-call
    description: '@backstage/plugin-proxy-node'
  - from: backstage/plugins/proxy-backend/router
    to: backstage/plugins/proxy-node/alpha
    type: direct-call
    description: '@backstage/plugin-proxy-node'
