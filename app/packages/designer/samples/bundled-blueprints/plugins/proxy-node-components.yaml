    defaultBranch: master
    scannedAtCommit: a052aea0e24911fcac803085ed79f3fe23e0a46e
    scanRoot: .
nodes:
  - entityRef: backstage/plugins/proxy-node/index
    type: background-worker
    name: index Service
    isTest: false
    properties:
      filepath: plugins/proxy-node/src/alpha/index.ts
      containerId: proxy-node
      technology: TypeScript Domain Service
      classification: default
    forensics:
      complexity: 0
      loc: 0
      sloc: 0
      churn: 1
      lineChurn: 48
      churn30: 1
      churn365: 1
      churnByWeek:
        - 0
        - 0
        - 0
        - 0
        - 0
        - 1
        - 0
        - 0
        - 0
      authorCount: 1
      topAuthorPercent: 1
      authors:
        - email: poldsberg@gmail.com
          commits: 1
      hotspotScore: 0
      sinceDays: 60
  - entityRef: backstage/plugins/proxy-backend/index
    type: background-worker
    name: index Service (External)
    external: true
    properties:
      filepath: plugins/proxy-backend/dev/index.ts
      containerId: proxy-backend
      technology: TypeScript Domain Service
      classification: default
    position:
      x: -360
      y: -204
  - entityRef: backstage/plugins/proxy-backend/plugin
    type: background-worker
    name: plugin Service (External)
    external: true
    properties:
      filepath: plugins/proxy-backend/src/plugin.ts
      containerId: proxy-backend
