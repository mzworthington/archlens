# yaml-language-server: $schema=https://archlens.dev/schemas/latest/blueprint.schema.json
version: https://archlens.dev/schemas/v4/blueprint.schema.json
level: context
metadata:
  entityRef: eshop
  name: E-Shop
  description: Sample e-commerce estate for import and merge demonstrations.
nodes:
  - entityRef: eshop/user
    type: person
    name: User
    properties:
      role: context-actor
  - entityRef: eshop
    type: software-system
    name: EShop System
    properties:
      rootPath: ''
      productId: eshop
    forensics:
      complexity: 25
      complexityPeak: 25
      cognitiveComplexity: 168
      churn: 0
      churn30: 0
      churn365: 0
      churnByWeek:
        - 0
        - 0
        - 0
        - 0
        - 0
        - 0
        - 0
        - 0
        - 0
      authorCount: 0
      hotspotScore: 1
      classifications:
        - hotspot
      sinceDays: 60
      fileCount: 128
      hotspotCount: 2
      knowledgeSiloCount: 0
dependencies:
  - from: application/user
    to: eshop
    type: direct-call
    description: Uses
  - from: eshop/user
    to: eshop
    type: direct-call
    description: Uses
