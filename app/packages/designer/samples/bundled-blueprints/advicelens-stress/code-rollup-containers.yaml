# yaml-language-server: $schema=https://archlens.dev/schemas/latest/blueprint.schema.json
version: https://archlens.dev/schemas/v4/blueprint.schema.json
level: container
metadata:
  entityRef: advicelens-stress/code-rollup
  name: AdviceLens - Code Roll-up
  description: >
    Minimal checkout container for drilling into component diagrams. Container-level
    forensics are quiet; the hotspot lives in the component diagram so AdviceLens can
    demonstrate applicability roll-up to the owning service.
nodes:
  - entityRef: advicelens-stress/code-rollup/web
    type: web-app
    name: Checkout Web
  - entityRef: advicelens-stress/code-rollup/checkout-api
    type: rest-api
    name: Checkout API
    forensics:
      complexity: 8
      loc: 320
      sloc: 240
      churn: 0.12
      churn30: 10
      churn365: 60
      churnByWeek: [1, 1, 2, 2, 2, 3, 3, 3]
      authorCount: 4
      topAuthorPercent: 0.45
      hotspotScore: 0.15
      classifications: []
      sinceDays: 365
  - entityRef: advicelens-stress/code-rollup/payments
    type: microservice
    name: Payments Adapter
dependencies:
  - from: advicelens-stress/code-rollup/web
    to: advicelens-stress/code-rollup/checkout-api
    type: direct-call
  - from: advicelens-stress/code-rollup/checkout-api
    to: advicelens-stress/code-rollup/payments
    type: direct-call
