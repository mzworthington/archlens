<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-dark.png" />
    <meta name="theme-color" content="#040914" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>ArchLens - Codebase Map Explorer</title>
    <meta
      name="description"
      content="ArchLens maps your codebase as an interactive C4-style diagram — explore systems, containers, and components, and keep architecture docs in sync with BlueprintSpec YAML."
    />
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://archlens.dev/" />
    <meta property="og:title" content="ArchLens - Codebase Map Explorer" />
    <meta property="og:description" content="ArchLens maps your codebase as an interactive C4-style diagram — explore systems, containers, and components, and keep architecture docs in sync with BlueprintSpec YAML." />
    <meta property="og:image" content="https://archlens.dev/assets/logo-dark.png" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://archlens.dev/" />
    <meta name="twitter:title" content="ArchLens - Codebase Map Explorer" />
    <meta name="twitter:description" content="ArchLens maps your codebase as an interactive C4-style diagram — explore systems, containers, and components, and keep architecture docs in sync with BlueprintSpec YAML." />
    <meta name="twitter:image" content="https://archlens.dev/assets/logo-dark.png" />
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
