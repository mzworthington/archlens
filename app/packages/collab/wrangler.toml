# Script + Durable Object. Custom domain collab.archlens.dev is Pulumi
# (infra/cloudflare WorkersCustomDomain), not a wrangler route.
name = "archlens-collab"
main = "src/index.ts"
compatibility_date = "2026-08-04"
workers_dev = true

[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true

[durable_objects]
bindings = [{ name = "COLLAB_ROOMS", class_name = "CollabRoom" }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["CollabRoom"]
