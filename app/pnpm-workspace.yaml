packages:
  - 'packages/*'

overrides:
  # Dependabot alerts: proxy-addr GHSA IP spoof, compression DoS, basic-ftp ReDoS.
  # source-map-js GHSA-68fv-2mgg-jv7q (CVE-2026-93749): indexed source-map DoS.
  source-map-js: '>=1.2.2'
  proxy-addr: '>=2.0.8'
  compression: '>=1.8.2'
  basic-ftp: '>=6.2.1'
  '@puppeteer/browsers': '>=3.2.1'
  brace-expansion@1: 1.1.21
  brace-expansion@2: 2.1.7
  brace-expansion@5: 5.0.12
  browserslist: '>=4.28.7'
  dompurify: '>=3.4.17'
  fast-uri: '>=4.2.3'
  ip-address: '>=10.7.4'
  serialize-javascript: '>=7.1.3'
  zod: '>=4.6.6'
  # GHSA-6pq8-jhm2-2vcw: comma arrayFormat throws through qs 6.16.0.
  qs: '>=6.16.1'
  # GHSA-3g3m-2fjr-6pw4: an aborted glob walk kept reading the filesystem.
  # Scoped so rimraf 3 can keep glob 7.
  "glob@>=9.0.0 <14.0.2": 14.0.3
  # GHSA-g3hv-75wg-m249: minimatch 10 has no in-range patch. Parents still declare ^10.
  'minimatch@10': 11.0.5
  # GHSA-gcqx-w48m-w2h4 has no release after 4.3.1. workbox-build pulls it
  # through @rollup/plugin-node-resolve.
  deepmerge: file:vendor/deepmerge
  js-yaml: '>=5.4.1'
  # mermaid 12 pulls katex >=0.18.2 (GHSA-238p-pmpm-9mq7). 11.x stays on katex 0.16.
  mermaid: '>=12.2.0'
  postcss: '>=8.5.18'
  tmp: '>=0.2.6'
  undici: '7.30.1'
  uuid@8: 11.1.1

allowBuilds:
  '@tree-sitter-grammars/tree-sitter-hcl': false
  '@vscode/vsce-sign': false
  keytar: false
  esbuild: true
  workerd: true
  tree-sitter: true
  tree-sitter-javascript: true
  tree-sitter-typescript: true
  core-js: false
minimumReleaseAgeExclude:
  - '@typescript/typescript-aix-ppc64@7.0.2'
  - '@typescript/typescript-darwin-arm64@7.0.2'
  - '@typescript/typescript-darwin-x64@7.0.2'
  - '@typescript/typescript-freebsd-arm64@7.0.2'
  - '@typescript/typescript-freebsd-x64@7.0.2'
  - '@typescript/typescript-linux-arm64@7.0.2'
  - '@typescript/typescript-linux-arm@7.0.2'
  - '@typescript/typescript-linux-loong64@7.0.2'
  - '@typescript/typescript-linux-mips64el@7.0.2'
  - '@typescript/typescript-linux-ppc64@7.0.2'
  - '@typescript/typescript-linux-riscv64@7.0.2'
  - '@typescript/typescript-linux-s390x@7.0.2'
  - '@typescript/typescript-linux-x64@7.0.2'
  - '@typescript/typescript-netbsd-arm64@7.0.2'
  - '@typescript/typescript-netbsd-x64@7.0.2'
  - '@typescript/typescript-openbsd-arm64@7.0.2'
  - '@typescript/typescript-openbsd-x64@7.0.2'
  - '@typescript/typescript-sunos-x64@7.0.2'
  - '@typescript/typescript-win32-arm64@7.0.2'
  - '@typescript/typescript-win32-x64@7.0.2'
  - typescript@7.0.2
  - vite@8.1.4 || 8.3.0
  - wrangler@4.131.0
  - '@posthog/browser-common@0.8.3'
  - '@posthog/core@1.53.2'
  - '@posthog/types@1.411.1'
  - miniflare@5.20260910.0-alpha
  - posthog-js@1.430.2
  - zod@4.6.2
  - '@isaacs/nonrecursive-glob-match@1.1.0'
  - minimatch@11.0.5
